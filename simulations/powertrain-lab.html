<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>汽车动力形式 · 透视整车能量流</title>
<style>
:root{
  --y:#f6c445;   /* 燃油/机械传递 */
  --b:#4d9dff;   /* 发电→电池 */
  --g:#41e08d;   /* 电池→电机→后轮 */
  --r:#ff5f57;   /* 发动机→前轮 */
  --line:rgba(255,255,255,.09);
  --line2:rgba(255,255,255,.16);
  --dim:#8fa2bf;
  --txt:#e9eef8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  color:var(--txt);
  background:
    radial-gradient(900px 520px at 10% -10%, #16233c 0%, transparent 62%),
    radial-gradient(760px 480px at 94% 6%, #0f2b33 0%, transparent 60%),
    #070c15;
  overflow:hidden;
  user-select:none;
}
.app{height:100%;display:flex;flex-direction:column;gap:9px;padding:11px 15px 13px}

/* ---------- 头部 ---------- */
header{display:flex;align-items:baseline;gap:14px;flex:0 0 auto}
header h1{font-size:19px;margin:0;letter-spacing:.5px;font-weight:700}
.sub{font-size:12.5px;color:var(--dim);margin:0}
header .sp{flex:1}
button{
  font-family:inherit;font-size:12.5px;cursor:pointer;
  padding:7px 15px;border-radius:9px;
  border:1px solid var(--line2);background:rgba(255,255,255,.05);color:#dbe5f5;
  transition:.16s;
}
button:hover:not(:disabled){background:rgba(255,255,255,.11);border-color:rgba(255,255,255,.28)}
button:disabled{opacity:.38;cursor:not-allowed}
button.primary{
  background:linear-gradient(180deg,#2fc4b0,#149e8b);
  border-color:#37cfba;color:#03130f;font-weight:700;letter-spacing:.5px;
  box-shadow:0 4px 16px rgba(47,196,176,.22);
}
button.primary:hover:not(:disabled){filter:brightness(1.08)}
button.primary.stop{
  background:linear-gradient(180deg,#e2604f,#c2412f);
  border-color:#e2604f;color:#fff;
  box-shadow:0 4px 16px rgba(226,96,79,.2);
}

/* ---------- 主体 ---------- */
.body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:11px}
.scene{
  position:relative;min-width:0;
  background:
    radial-gradient(680px 320px at 50% 0%, rgba(64,98,160,.14), transparent 70%),
    linear-gradient(180deg,#0b1220,#080d18);
  border:1px solid var(--line);border-radius:13px;
  overflow:hidden;
}
.scene svg{position:absolute;inset:0;width:100%;height:100%}

/* 效率角标 */
.eff{
  position:absolute;right:14px;bottom:10px;text-align:right;pointer-events:none;
  padding:8px 14px 9px;border-radius:12px;
  background:rgba(7,12,21,.72);border:1px solid var(--line2);
  backdrop-filter:blur(4px);min-width:150px;
}
.eff .m{font-size:12.5px;color:var(--dim);margin-bottom:1px}
.eff .v{font-size:34px;font-weight:800;line-height:1.05;color:#fff}
.eff .v span{font-size:15px;font-weight:600;color:var(--dim);margin-left:2px}
.eff .c{font-size:10.5px;color:var(--dim);margin-top:3px;line-height:1.45;max-width:230px}

/* ---------- 侧栏 ---------- */
aside{display:flex;flex-direction:column;gap:9px;min-height:0;overflow:auto}
.panel{
  background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
  border:1px solid var(--line);border-radius:12px;padding:9px 11px;
}
.panel h3{margin:0 0 8px;font-size:12.5px;color:var(--dim);font-weight:600;letter-spacing:.5px}

.parts{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.pt{
  display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:10px;
  border:1px solid var(--line2);background:rgba(255,255,255,.03);cursor:pointer;
  transition:.15s;min-width:0;
}
.pt:hover{border-color:rgba(255,255,255,.32);background:rgba(255,255,255,.07)}
.pt svg{width:34px;height:24px;flex:0 0 34px}
.pt .nm{font-size:12px;font-weight:600;white-space:nowrap}
.pt .st{font-size:10px;color:var(--dim);white-space:nowrap}
.pt.off{opacity:.45;border-style:dashed;filter:grayscale(.7)}

.info{font-size:12px;line-height:1.75}
.info .row{display:flex;gap:7px;align-items:flex-start}
.info .dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px;margin-top:6px}
.info .qa{
  margin-top:7px;padding:7px 9px;border-radius:8px;font-size:11px;line-height:1.6;
  background:rgba(77,157,255,.08);border:1px solid rgba(77,157,255,.22);color:#bcd4f5;
}
.info .hint{
  margin-top:7px;padding:7px 9px;border-radius:8px;font-size:11px;line-height:1.6;
  background:rgba(246,196,69,.08);border:1px solid rgba(246,196,69,.25);color:#efdCA8;
}
.badge{
  display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:700;
  background:rgba(65,224,141,.14);border:1px solid rgba(65,224,141,.4);color:#5ee6a0;
}
@media (max-width:900px){
  .body{grid-template-columns:1fr;grid-template-rows:minmax(300px,1fr) auto}
}
</style>
</head>
<body>

    <aside>

</div>

<script id="pure">
/* ===== 纯逻辑（可被 Node 自检脚本单独抽取） ===== */
var PARTS = [
  {id:'tank',  name:'油箱',   desc:'存储汽油（化学能）'},
  {id:'engine',name:'发动机', desc:'化学能 → 机械能'},
  {id:'gen',   name:'发电机', desc:'机械能 → 电能'},
  {id:'shaft', name:'传动轴', desc:'发动机直驱前轮'},
  {id:'batt',  name:'动力电池', desc:'存储电能'},
  {id:'motor', name:'电动机', desc:'电能 → 机械能，驱动后轮'}
];

var MODES = {
  ice:  {name:'纯油模式', eff:25, paths:['R'],          nconv:1,
         chain:'化学能 → 机械能',
         rows:[['R','红色路径：发动机 → 前轮']],
         qa:'纯油车效率约 25%：大部分能量以废热与排气损失带走，机械路径虽直接，热效率先天偏低。'},
  erev: {name:'串联增程（增程模式）', eff:30, paths:['Y','B','G'], nconv:4,
         chain:'化学能 → 机械能 → 电能 → 电能 → 机械能',
         rows:[['Y','黄色路径：汽油 → 发动机 → 发电机'],
               ['B','蓝色路径：发电机 → 电池'],
               ['G','绿色路径：电池 → 电动机 → 后轮']],
         qa:'增程模式下发动机没有直接驱动车轮，能量经过 4 次转化（化学能→机械能→电能→电能→机械能），总效率约 30%。'},
  phev: {name:'并联插混（四驱）', eff:45, paths:['R','G'],  nconv:2,
         chain:'红路：化学能→机械能（前轮）｜ 绿路：电能→机械能（后轮）',
         rows:[['R','红色路径：发动机 → 前轮'],
               ['G','绿色路径：电池 → 电动机 → 后轮']],
         qa:'发动机驱动前轮、电动机驱动后轮，前轮和后轮同时在转＝四驱。这就是插混天然就是四驱的原因；发动机可直驱车轮，比增程少一步"机械能→电能"的转化损失，效率 45%。'},
  ev:   {name:'纯电模式', eff:80, paths:['G'],           nconv:1,
         chain:'电能 → 机械能',
         rows:[['G','绿色路径：电池 → 电动机 → 后轮']],
         qa:'纯电效率最高（约 80%），因为路径最短：只有 电池 → 电机 → 车轮 两步。'}
};

function judge(s){
  var canEngine = s.tank && s.engine;
  var canEV     = s.batt && s.motor;
  if (canEngine && canEV){
    if (s.shaft && s.gen)  return {key:'phev'};
    if (!s.shaft && s.gen) return {key:'erev'};
    if (s.shaft && !s.gen)
      return {key:'custom', hint:'发动机已直驱前轮、电池与电动机已就位，但缺少发电机——电池无法补电，亏电后无法持续。装上发电机即为并联插混。'};
    return {key:'custom', hint:'发动机与车轮之间没有传动轴，也没有发电机消耗机械能——发动机的动力没有去处。加装传动轴或发电机。'};
  }
  if (canEngine && !canEV){
    if (s.shaft && !s.batt && !s.motor) return {key:'ice'};
    if (!s.shaft && s.batt && !s.motor)
      return {key:'custom', hint:'发电机可以给电池充电，但缺少电动机——电能无法转化为驱动车轮的机械能。装上电动机即为串联增程。'};
    if (!s.shaft && !s.batt && s.motor)
      return {key:'custom', hint:'有电动机但没有电池，电能没有来源。补上电池（通常还需发电机）构成电驱通路。'};
    return {key:'custom', hint:'动力没有完整的输出路径：要么加装传动轴让发动机直驱前轮，要么补齐"发电机→电池→电动机"的电驱链路。'};
  }
  if (!canEngine && canEV){
    if (!s.engine && !s.tank) return {key:'ev'};
    return {key:'custom', hint:'电池与电动机已就绪，但发动机缺油或缺件仍挂在车上。要做纯电，请拆下发动机与油箱；要做增程/插混，请把油箱和发动机装齐。'};
  }
  return {key:'empty', hint:'至少安装一套动力源：油箱＋发动机（油路），或 电池＋电动机（电路）。'};
}
if (typeof window === 'undefined' && typeof globalThis !== 'undefined'){
  globalThis.__pure = { PARTS: PARTS, MODES: MODES, judge: judge };
}
</script>

<script>
/* ===== 界面与动画 ===== */
var state = { tank:true, engine:true, gen:true, shaft:true, batt:true, motor:true };
var running = false;
var shellOn = true;
var cur = judge(state);
var spinF = 0, spinR = 0, dashOff = 0, soc = 88;

var $ = function(id){ return document.getElementById(id); };

/* ---------- 部件卡片 ---------- */
var PART_ICON = {
  tank:  '<rect x="3" y="7" width="28" height="13" rx="5" fill="#48536b"/><rect x="6" y="12" width="22" height="6" rx="2" fill="#f6c445" opacity=".4"/>',
  engine:'<rect x="6" y="5" width="22" height="14" rx="3" fill="#98a4b6"/><rect x="9" y="2" width="16" height="4" rx="1.5" fill="#aab5c5"/><circle cx="7" cy="19" r="3" fill="#77839a"/>',
  gen:   '<rect x="8" y="6" width="18" height="13" rx="4" fill="#98a4b6"/><rect x="11" y="8" width="3.5" height="9" fill="#f2ac62"/><rect x="17" y="8" width="3.5" height="9" fill="#f2ac62"/>',
  shaft: '<line x1="5" y1="18" x2="29" y2="8" stroke="#7c8798" stroke-width="4" stroke-linecap="round"/><circle cx="5" cy="18" r="3" fill="#98a4b6"/><circle cx="29" cy="8" r="3" fill="#98a4b6"/>',
  batt:  '<rect x="4" y="7" width="26" height="12" rx="2.5" fill="#232b3d" stroke="#46536e"/><rect x="7" y="9" width="4" height="8" fill="#ff9f43"/><rect x="14" y="9" width="4" height="8" fill="#ff9f43"/><rect x="21" y="9" width="4" height="8" fill="#ff9f43"/>',
  motor: '<rect x="8" y="6" width="18" height="13" rx="5" fill="#98a4b6"/><line x1="11" y1="10" x2="23" y2="10" stroke="#77839a" stroke-width="1.5"/><line x1="11" y1="14" x2="23" y2="14" stroke="#77839a" stroke-width="1.5"/>'
};
function buildParts(){
  var html = '';
  for (var i=0;i<PARTS.length;i++){
    var p = PARTS[i];
    html += '<div class="pt" data-part="'+p.id+'" title="'+p.desc+'">'
         +  '<svg viewBox="0 0 34 24">'+PART_ICON[p.id]+'</svg>'
         +  '<div><div class="nm">'+p.name+'</div><div class="st"></div></div></div>';
  }
  $('partsGrid').innerHTML = html;
  var cards = document.querySelectorAll('.pt');
  for (var j=0;j<cards.length;j++){
    cards[j].addEventListener('click', function(){
      toggle(this.getAttribute('data-part'));
    });
  }
}

/* ---------- 状态切换 ---------- */
function toggle(id){
  state[id] = !state[id];
  if (running){ cur = judge(state); if (cur.key==='custom'||cur.key==='empty') stop(); }
  render();
}
/* ---------- 启停 ---------- */
function start(){
  cur = judge(state);
  if (cur.key!=='ice'&&cur.key!=='erev'&&cur.key!=='phev'&&cur.key!=='ev') return;
  running = true;
  $('btnRun').textContent = '■ 停止';
  $('btnRun').classList.add('stop');
  render();
}
function stop(){
  running = false;
  $('btnRun').textContent = '▶ 启动';
  $('btnRun').classList.remove('stop');
  render();
}

/* ---------- 渲染 ---------- */
var PIPE_OF = {
  tank:'pipeFuel', engine:'pipeEG', gen:'pipeGB', batt:'pipeBM', motor:'pipeRA', shaft:'pipeFA'
};
function render(){
  cur = judge(state);
  /* 部件实体 / 幽灵槽 */
  for (var i=0;i<PARTS.length;i++){
    var p = PARTS[i];
    $('p-'+p.id).style.display  = state[p.id] ? '' : 'none';
    $('gs-'+p.id).style.display = state[p.id] ? 'none' : '';
  }
  /* 管路底色：两端部件齐备即显示 */
  $('pipeFuel').style.display = (state.tank&&state.engine) ? '' : 'none';
  $('pipeEG').style.display   = (state.engine&&state.gen)  ? '' : 'none';
  $('pipeGB').style.display   = (state.gen&&state.batt)    ? '' : 'none';
  $('pipeBM').style.display   = (state.batt&&state.motor)  ? '' : 'none';
  $('pipeRA').style.display   = state.motor ? '' : 'none';
  $('pipeFA').style.display   = (state.shaft&&state.engine) ? '' : 'none';

  /* 部件卡片 */
  var cards = document.querySelectorAll('.pt');
  for (var j=0;j<cards.length;j++){
    var id = cards[j].getAttribute('data-part');
    cards[j].classList.toggle('off', !state[id]);
    cards[j].querySelector('.st').textContent = state[id] ? '已安装' : '未安装';
  }

  /* 能量流显隐 */
  var mode = MODES[cur.key];
  var flowIds = ['flowY','flowB','flowG','flowR'];
  var pathKeys = ['Y','B','G','R'];
  for (var f=0;f<4;f++){
    var on = running && mode && mode.paths.indexOf(pathKeys[f])>=0;
    $(flowIds[f]).style.opacity = on ? 1 : 0;
  }

  /* 效率角标 */
  if (cur.key==='custom'||cur.key==='empty'){
    $('effMode').textContent = cur.key==='empty' ? '整车未成形' : '自定义组装中';
    $('effVal').textContent = '—';
    $('effVal').style.color = '#8fa2bf';
    $('effChain').textContent = cur.hint || '';
  } else {
    $('effMode').textContent = mode.name;
    $('effVal').innerHTML = running ? (mode.eff + '<span>%</span>') : '—';
    $('effVal').style.color = running ? '#5ee6a0' : '#8fa2bf';
    $('effChain').textContent = mode.chain + '（' + mode.nconv + ' 次转化）';
  }

  /* 信息面板 */
  var h = '';
  if (cur.key==='custom'||cur.key==='empty'){
    h += '<div class="row"><span class="badge" style="background:rgba(246,196,69,.14);border-color:rgba(246,196,69,.4);color:#efdCA8">'
      +  (cur.key==='empty'?'未成形':'组装中') + '</span></div>'
      +  '<div class="hint">'+cur.hint+'</div>';
  } else {
    h += '<div class="row"><span class="badge">'+mode.name+'</span>'
      +  '<span style="color:var(--dim);font-size:11px;margin-top:4px">总效率约 '
      +  mode.eff + '%（' + mode.nconv + ' 次转化）</span></div>';
    for (var r=0;r<mode.rows.length;r++){
      var c = {Y:'var(--y)',B:'var(--b)',G:'var(--g)',R:'var(--r)'}[mode.rows[r][0]];
      h += '<div class="row"><span class="dot" style="background:'+c+'"></span><span>'+mode.rows[r][1]+'</span></div>';
    }
    h += '<div class="qa">【预设答案】'+mode.qa+'</div>';
  }
  $('infoBody').innerHTML = h;
}

/* ---------- 动画循环 ---------- */
var tPrev = 0;
function frame(ts){
  var dt = Math.min((ts - tPrev)/1000, .05); tPrev = ts;
  if (running){
    dashOff -= dt * 85;
    var mode = MODES[cur.key];
    if (mode){
      /* 车头在左，前进＝向左，车轮逆时针（负向）转动 */
      if (mode.paths.indexOf('R')>=0) spinF -= dt * 240;
      if (mode.paths.indexOf('G')>=0) spinR -= dt * 290;
    }
    /* 电量单调变化：纯电放电下降；有发电机充电时回升 */
    var charges = (state.gen && state.engine && state.tank);
    var drains  = mode && mode.paths.indexOf('G')>=0;
    if (drains && !charges) soc = Math.max(6, soc - dt*9);
    else if (charges)       soc = Math.min(100, soc + dt*7);
  }
  $('spF').setAttribute('transform', 'rotate('+spinF+' 205 334)');
  $('spR').setAttribute('transform', 'rotate('+spinR+' 760 334)');
  var fl = document.querySelectorAll('.fl');
  for (var i=0;i<fl.length;i++) fl[i].setAttribute('stroke-dashoffset', dashOff);
  /* 发动机振动 */
  var vib = (running && state.engine) ? ('translate(' + (Math.sin(ts*.055)*1.3).toFixed(2) + ',' + (Math.cos(ts*.08)*0.9).toFixed(2) + ')') : '';
  $('g-engine').setAttribute('transform', vib);
  /* 电池电量条（随工况单调变化，不来回伸缩） */
  var sw = Math.max(4, 118*soc/100);
  $('socBar').setAttribute('width', sw.toFixed(1));
  $('socBar').setAttribute('fill', soc>30 ? '#41e08d' : (soc>15 ? '#f6c445' : '#ff5f57'));
  requestAnimationFrame(frame);
}

/* ---------- 事件 ---------- */
$('btnRun').addEventListener('click', function(){ running ? stop() : start(); });
$('btnShell').addEventListener('click', function(){
  shellOn = !shellOn;
  $('shell').style.opacity = shellOn ? 1 : .06;
  this.textContent = shellOn ? '外壳：透视中' : '外壳：已隐藏';
});
var p3d = document.querySelectorAll('.part3d');
for (var d=0;d<p3d.length;d++){
  p3d[d].addEventListener('click', function(){
    toggle(this.id.replace('p-',''));
  });
}

buildParts();
render();
requestAnimationFrame(frame);
</script>
</body>
</html>
