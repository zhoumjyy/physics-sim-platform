<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>汽车动力形式 · 3D 透视整车能量流</title>
<style>
:root{
  --y:#f6c445;   /* 燃油/机械传递 */
  --b:#4d9dff;   /* 发电→电池 */
  --g:#41e08d;   /* 电池→电机→后轮 */
  --r:#ff5f57;   /* 发动机→前轮 */
  --k:#37e0d8;   /* 动能回收（反向） */
  --line:rgba(255,255,255,.09);
  --line2:rgba(255,255,255,.16);
  --dim:#8fa2bf;
  --txt:#e9eef8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  color:var(--txt);
  background:
    radial-gradient(900px 520px at 10% -10%, #16233c 0%, transparent 62%),
    radial-gradient(760px 480px at 94% 6%, #0f2b33 0%, transparent 60%),
    #070c15;
  overflow:hidden;
  user-select:none;
}
.app{height:100%;display:flex;flex-direction:column;gap:9px;padding:11px 15px 13px}

/* ---------- 头部 ---------- */
header{display:flex;align-items:baseline;gap:14px;flex:0 0 auto;flex-wrap:wrap}
header h1{font-size:19px;margin:0;letter-spacing:.5px;font-weight:700}
.sub{font-size:12.5px;color:var(--dim);margin:0}
header .sp{flex:1}
button{
  font-family:inherit;font-size:12.5px;cursor:pointer;
  padding:7px 15px;border-radius:9px;
  border:1px solid var(--line2);background:rgba(255,255,255,.05);color:#dbe5f5;
  transition:.16s;
}
button:hover:not(:disabled){background:rgba(255,255,255,.11);border-color:rgba(255,255,255,.28)}
button:disabled{opacity:.38;cursor:not-allowed}
button.primary{
  background:linear-gradient(180deg,#2fc4b0,#149e8b);
  border-color:#37cfba;color:#03130f;font-weight:700;letter-spacing:.5px;
  box-shadow:0 4px 16px rgba(47,196,176,.22);
}
button.primary:hover:not(:disabled){filter:brightness(1.08)}
button.primary.stop{
  background:linear-gradient(180deg,#e2604f,#c2412f);
  border-color:#e2604f;color:#fff;
  box-shadow:0 4px 16px rgba(226,96,79,.2);
}
button.regen{
  background:linear-gradient(180deg,#2bb6b0,#1c847f);
  border-color:#37e0d8;color:#022;font-weight:700;
}
button.regen.on{ background:linear-gradient(180deg,#37e0d8,#1aa39c); color:#022; box-shadow:0 4px 16px rgba(55,224,216,.28);}

/* ---------- 主体 ---------- */
.body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:11px}
.scene{
  position:relative;min-width:0;
  background:
    radial-gradient(680px 320px at 50% 0%, rgba(64,98,160,.14), transparent 70%),
    linear-gradient(180deg,#0b1220,#080d18);
  border:1px solid var(--line);border-radius:13px;
  overflow:hidden;
}
.scene svg{position:absolute;inset:0;width:100%;height:100%}

/* 效率角标 */
.eff{
  position:absolute;right:14px;bottom:10px;text-align:right;pointer-events:none;
  padding:8px 14px 9px;border-radius:12px;
  background:rgba(7,12,21,.72);border:1px solid var(--line2);
  backdrop-filter:blur(4px);min-width:160px;
}
.eff .m{font-size:12.5px;color:var(--dim);margin-bottom:1px}
.eff .v{font-size:34px;font-weight:800;line-height:1.05;color:#fff}
.eff .v span{font-size:15px;font-weight:600;color:var(--dim);margin-left:2px}
.eff .c{font-size:10.5px;color:var(--dim);margin-top:3px;line-height:1.45;max-width:250px}

/* ---------- 侧栏 ---------- */
aside{display:flex;flex-direction:column;gap:9px;min-height:0;overflow:auto}
.panel{
  background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
  border:1px solid var(--line);border-radius:12px;padding:9px 11px;
}
.panel h3{margin:0 0 8px;font-size:12.5px;color:var(--dim);font-weight:600;letter-spacing:.5px}

.parts{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.pt{
  display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:10px;
  border:1px solid var(--line2);background:rgba(255,255,255,.03);cursor:pointer;
  transition:.15s;min-width:0;
}
.pt:hover{border-color:rgba(255,255,255,.32);background:rgba(255,255,255,.07)}
.pt svg{width:34px;height:24px;flex:0 0 34px}
.pt .nm{font-size:12px;font-weight:600;white-space:nowrap}
.pt .st{font-size:10px;color:var(--dim);white-space:nowrap}
.pt.off{opacity:.45;border-style:dashed;filter:grayscale(.7)}

.info{font-size:12px;line-height:1.75}
.info .row{display:flex;gap:7px;align-items:flex-start}
.info .dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px;margin-top:6px}
.info .qa{
  margin-top:7px;padding:7px 9px;border-radius:8px;font-size:11px;line-height:1.6;
  background:rgba(77,157,255,.08);border:1px solid rgba(77,157,255,.22);color:#bcd4f5;
}
.info .hint{
  margin-top:7px;padding:7px 9px;border-radius:8px;font-size:11px;line-height:1.6;
  background:rgba(246,196,69,.08);border:1px solid rgba(246,196,69,.25);color:#efdca8;
}
.info .warn{
  margin-top:7px;padding:7px 9px;border-radius:8px;font-size:11px;line-height:1.6;
  background:rgba(255,95,87,.10);border:1px solid rgba(255,95,87,.35);color:#ffb3ae;
}
.badge{
  display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:700;
  background:rgba(65,224,141,.14);border:1px solid rgba(65,224,141,.4);color:#5ee6a0;
}
@media (max-width:900px){
  .body{grid-template-columns:1fr;grid-template-rows:minmax(320px,1fr) auto}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>汽车动力形式 · 3D 透视整车</h1>
    <p class="sub">侧上方斜视视角 · 组装 / 拆卸部件，观察四种动力形式的能量流动</p>
    <span class="sp"></span>
    <button id="btnShell">外壳：透视中</button>
    <button id="btnBrake" class="regen">⚡ 刹车 / 动能回收</button>
    <button id="btnRun" class="primary">▶ 启动</button>
  </header>

  <div class="body">
    <div class="scene" id="scene">
      <svg id="svg" viewBox="0 0 1000 440" preserveAspectRatio="xMidYMid meet">
        <defs>
          <linearGradient id="gMetal" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#d7deea"/>
            <stop offset=".5" stop-color="#98a4b6"/>
            <stop offset="1" stop-color="#5f6a7d"/>
          </linearGradient>
          <linearGradient id="gCopper" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f2ac62"/>
            <stop offset="1" stop-color="#9c5a26"/>
          </linearGradient>
          <radialGradient id="gGround" cx="50%" cy="0%" r="80%">
            <stop offset="0" stop-color="#13203a"/>
            <stop offset="1" stop-color="#080d18"/>
          </radialGradient>
          <filter id="fGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="3" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <marker id="ah" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
            <path d="M0,0 L9,4 L0,8 Z" fill="#7fd0ff"/>
          </marker>
        </defs>
        <g id="world"></g>
      </svg>

      <div class="eff">
        <div class="m" id="effMode">整车未成形</div>
        <div class="v" id="effVal">—</div>
        <div class="c" id="effChain">从右侧组装部件，系统将自动识别动力形式</div>
      </div>
    </div>

    <aside>
      <div class="panel">
        <h3>玩法</h3>
        <div style="font-size:12px;line-height:1.7;color:var(--dim)">
          点击右侧部件卡片，或直接<b style="color:#cfd9ea">点车内部件</b>进行安装 / 拆卸。<br>
          组装完成后系统自动识别动力形式；运行时点亮对应能量流；<b style="color:#37e0d8">刹车</b>可演示动能回收。
        </div>
      </div>

      <div class="panel">
        <h3>部件装配（点击安装 / 拆卸，车内部件同样可点）</h3>
        <div class="parts" id="partsGrid"></div>
      </div>

      <div class="panel info" id="infoPanel">
        <h3>当前状态</h3>
        <div id="infoBody"></div>
      </div>
    </aside>
  </div>
</div>

<script id="pure">
/* ===== 纯逻辑（可被 Node 自检脚本单独抽取） ===== */
var PARTS = [
  {id:'tank',  name:'油箱',   desc:'存储汽油（化学能）'},
  {id:'engine',name:'发动机', desc:'化学能 → 机械能'},
  {id:'gen',   name:'发电机', desc:'机械能 → 电能'},
  {id:'gearbox',name:'变速箱',desc:'发动机直驱前轮（机械耦合）'},
  {id:'batt',  name:'动力电池', desc:'存储电能'},
  {id:'motor', name:'电动机', desc:'电能 → 机械能，驱动后轮'}
];

var MODES = {
  ice:  {name:'纯油模式', eff:25, paths:['R'],          nconv:1,
         chain:'化学能 → 机械能',
         rows:[['R','红色路径：发动机 → 变速箱 → 前轮']],
         qa:'纯油车效率约 25%：大部分能量以废热与排气损失带走，机械路径虽直接，热效率先天偏低。'},
  erev: {name:'串联增程（增程模式）', eff:30, paths:['Y','B','G'], nconv:4,
         chain:'化学能 → 机械能 → 电能 → 电能 → 机械能',
         rows:[['Y','黄色路径：汽油 → 发动机 → 发电机'],
               ['B','蓝色路径：发电机 → 电池'],
               ['G','绿色路径：电池 → 电动机 → 后轮']],
         qa:'增程模式下发动机没有直接驱动车轮（只带动发电机发电），能量经过 4 次转化（化学能→机械能→电能→电能→机械能），总效率约 30%。'},
  phev: {name:'并联插混（四驱）', eff:45, paths:['R','G'],  nconv:2,
         chain:'红路：化学能→机械能（前轮）｜ 绿路：电能→机械能（后轮）',
         rows:[['R','红色路径：发动机 → 变速箱 → 前轮'],
               ['G','绿色路径：电池 → 电动机 → 后轮']],
         qa:'发动机经变速箱驱动前轮、电动机驱动后轮，前轮和后轮同时在转＝四驱。这就是插混天然就是四驱的原因；发动机可直驱车轮，比增程少一步"机械能→电能"的转化损失，效率 45%。'},
  ev:   {name:'纯电模式', eff:80, paths:['G'],           nconv:1,
         chain:'电能 → 机械能',
         rows:[['G','绿色路径：电池 → 电动机 → 后轮']],
         qa:'纯电效率最高（约 80%），因为路径最短：只有 电池 → 电机 → 车轮 两步。'}
};

function judge(s){
  var canEngine = s.tank && s.engine;
  var canEV     = s.batt && s.motor;
  var gb = s.gearbox, gen = s.gen;
  if (canEngine && canEV){
    if (gb && gen)  return {key:'phev'};
    if (!gb && gen) return {key:'erev'};
    if (gb && !gen)
      return {key:'custom', hint:'发动机已直驱前轮、电池与电动机已就位，但缺少发电机——电池无法补电，亏电后无法持续。装上发电机即为并联插混。'};
    return {key:'custom', hint:'发动机的动力没有去处——加装变速箱让发动机直驱前轮，或加装发电机构成电驱链路。'};
  }
  if (canEngine && !canEV){
    if (gb && !s.batt && !s.motor) return {key:'ice'};
    if (!gb && s.batt && !s.motor)
      return {key:'custom', hint:'发电机可以给电池充电，但缺少电动机——电能无法转化为驱动车轮的机械能。装上电动机即为串联增程。'};
    if (!gb && !s.batt && s.motor)
      return {key:'custom', hint:'有电动机但没有电池，电能没有来源。补上电池（通常还需发电机）构成电驱通路。'};
    return {key:'custom', hint:'动力没有完整的输出路径：要么加装变速箱让发动机直驱前轮，要么补齐"发电机→电池→电动机"的电驱链路。'};
  }
  if (!canEngine && canEV){
    if (!s.engine && !s.tank) return {key:'ev'};
    return {key:'custom', hint:'电池与电动机已就绪，但发动机缺油或缺件仍挂在车上。要做纯电，请拆下发动机与油箱；要做增程/插混，请把油箱和发动机装齐。'};
  }
  return {key:'empty', hint:'至少安装一套动力源：油箱＋发动机（油路），或 电池＋电动机（电路）。'};
}
if (typeof window === 'undefined' && typeof globalThis !== 'undefined'){
  globalThis.__pure = { PARTS: PARTS, MODES: MODES, judge: judge };
}
</script>

<script>
/* ===== 3D 斜视投影 + 界面与动画 ===== */
/* ---- 斜投影参数：侧上方斜视（前-左-上）---- */
var SCALE = 2.12, OX = 165, OY = 372;
var TILT = 0.30;   /* 深度(车宽)在屏幕 X 的偏移 */
var RISE = 0.52;   /* 深度在屏幕 Y 的抬升（体现"上方"视角） */
function P(x,y,z){ return [ OX + SCALE*(x + z*TILT), OY - SCALE*(y + z*RISE) ]; }
function ptStr(a){ return a[0].toFixed(1)+','+a[1].toFixed(1); }
function n2(v){ return v.toFixed(1); }

/* ---- 部件 3D 包围盒 [x0,y0,z0, x1,y1,z1] + 配色[顶,侧,前]（位置参考真实车辆） ---- */
var BOX = {
  /* 发动机：车头最前端、引擎盖下（顶 62 < 该处引擎盖线 ~72，绝不穿出） */
  engine: {b:[14,42,-30, 62,62,30],  c:['#cdd6e2','#8f9bab','#646f82']},
  /* 发电机：紧贴发动机后端（增程/发电时由发动机带动） */
  gen:    {b:[62,46,-20, 88,64,20],  c:['#e6b878','#b67f37','#875c22']},
  /* 变速箱：发动机与前轴之间（前轴 X=95），把动力传给前轮 */
  gearbox:{b:[84,40,-22,106,58,22],  c:['#bcc6d4','#8a96a8','#5d6678']},
  /* 动力电池：平铺底盘中央（两轴之间、地板下方） */
  batt:   {b:[120,40,-34,250,52,34], c:['#33415f','#222c44','#161e30']},
  /* 电动机：后轴前方（X≈270），驱动后轮 */
  motor:  {b:[252,46,-24,288,70,24], c:['#cdd6e2','#8f9bab','#646f82']},
  /* 油箱：车尾、后轴上方 */
  tank:   {b:[300,44,-30,352,68,30], c:['#5b667e','#3e475e','#2b3346']}
};
var WR = 30;                            /* 车轮半径 */
var WHEELS = { fw:{x:95,z:-30}, rw:{x:285,z:-30} };  /* 前轴/后轴（近端可见） */
function centers(){
  return {
    eng:  P(38,52,0),
    gen:  P(75,55,0),
    gb:   P(95,49,0),
    batt: P(185,46,0),
    mot:  P(270,58,0),
    tank: P(326,56,0),
    fw:   P(95,30,-30),
    rw:   P(285,30,-30)
  };
}

/* ---- 通用面绘制 ---- */
function quad(a,b,c,d, fill, op, stroke){
  return '<polygon points="'+ptStr(a)+' '+ptStr(b)+' '+ptStr(c)+' '+ptStr(d)+'" fill="'+fill+'" '+
         (op!=null?'fill-opacity="'+op+'" ':'')+
         (stroke?'stroke="'+stroke+'" stroke-width="1" stroke-opacity=".5" ':'')+'/>';
}
/* 立体盒子：近侧面/顶面/前面 三面 */
function box3d(b,c){
  var x0=b[0],y0=b[1],z0=b[2],x1=b[3],y1=b[4],z1=b[5];
  var A=P(x0,y0,z0),B=P(x1,y0,z0),C=P(x1,y1,z0),D=P(x0,y1,z0);
  var E=P(x0,y0,z1),F=P(x1,y0,z1),G=P(x1,y1,z1),H=P(x0,y1,z1);
  var s='';
  s+=quad(A,B,C,D, c[1], 1);            /* 近侧面 */
  s+=quad(D,C,G,H, c[0], 1);            /* 顶面 */
  s+=quad(A,D,H,E, c[2], 1);            /* 前面 */
  return s;
}
/* 幽灵槽（虚线线框） */
function ghost3d(b){
  var x0=b[0],y0=b[1],z0=b[2],x1=b[3],y1=b[4],z1=b[5];
  var A=P(x0,y0,z0),B=P(x1,y0,z0),C=P(x1,y1,z0),D=P(x0,y1,z0);
  var E=P(x0,y0,z1),F=P(x1,y0,z1),G=P(x1,y1,z1),H=P(x0,y1,z1);
  var st='fill="none" stroke="rgba(255,255,255,.20)" stroke-width="1.4" stroke-dasharray="5 6"';
  return '<polygon points="'+ptStr(A)+' '+ptStr(B)+' '+ptStr(C)+' '+ptStr(D)+'" '+st+'/>'
       + '<polygon points="'+ptStr(D)+' '+ptStr(C)+' '+ptStr(G)+' '+ptStr(H)+'" '+st+'/>'
       + '<polygon points="'+ptStr(A)+' '+ptStr(D)+' '+ptStr(H)+' '+ptStr(E)+'" '+st+'/>';
}

/* ---- 车身轮廓（侧面剪影：X=车长 0前→360后, Y=高） ---- */
var PROFILE = [
  [0,42],[2,68],[34,78],[104,80],[150,118],[225,120],
  [258,92],[310,86],[356,84],[360,42]
];
function polyOf(pts,z){ return pts.map(function(p){return ptStr(P(p[0],p[1],z));}).join(' '); }
function bodyBase(){
  var zN=-44, zF=44;
  var s='';
  /* 地面（Y=0 平面投影为平行四边形） */
  s+=quad(P(0,0,zN),P(360,0,zN),P(360,0,zF),P(0,0,zF), 'url(#gGround)', 1, null);
  /* 车底阴影 */
  s+='<ellipse cx="'+P(180,0,0)[0].toFixed(1)+'" cy="'+P(180,0,0)[1].toFixed(1)+'" rx="'+(SCALE*185).toFixed(1)+'" ry="16" fill="#000" opacity=".4"/>';
  /* 远端车壳（淡，体现厚度） */
  s+='<polygon points="'+polyOf(PROFILE,zF)+'" fill="#7fa0d8" fill-opacity=".07" stroke="rgba(150,185,240,.14)" stroke-width="1.5"/>';
  /* 车顶/引擎盖/行李箱 拉伸壁（各边 z 近→远 扫掠） */
  for (var i=0;i<PROFILE.length-1;i++){
    var p=PROFILE[i], q=PROFILE[i+1];
    if (p[1]<43 && q[1]<43) continue; /* 底边不画壁 */
    s+=quad(P(p[0],p[1],zN),P(q[0],q[1],zN),P(q[0],q[1],zF),P(p[0],p[1],zF), '#9fb8e6', .10, null);
  }
  return s;
}
function shellGlass(){
  var zN=-44;
  var s='<g id="shellG">';
  /* 车窗（贴在近端剪影的座舱玻璃） */
  var win=[[142,86],[152,112],[222,114],[252,90]];
  s+='<polygon points="'+polyOf(win,zN)+'" fill="#0c1426" fill-opacity=".55" stroke="rgba(150,190,255,.35)" stroke-width="1.5"/>';
  s+='<line x1="'+P(196,86,zN)[0].toFixed(1)+'" y1="'+P(196,86,zN)[1].toFixed(1)+'" x2="'+P(200,114,zN)[0].toFixed(1)+'" y2="'+P(200,114,zN)[1].toFixed(1)+'" stroke="rgba(150,190,255,.3)" stroke-width="2"/>';
  /* 近端车壳（玻璃感，半透明，可见内部） */
  s+='<polygon id="shellNear" points="'+polyOf(PROFILE,zN)+'" fill="url(#gMetal)" fill-opacity=".14" stroke="rgba(180,210,255,.55)" stroke-width="2.5"/>';
  /* 前格栅 + 大灯 + 尾灯（贴在近端轮廓） */
  s+='<rect x="'+P(3,52,zN)[0].toFixed(1)+'" y="'+P(3,52,zN)[1].toFixed(1)+'" width="5" height="'+(SCALE*11).toFixed(1)+'" fill="#1b2233" fill-opacity=".7"/>';
  s+='<circle cx="'+P(7,62,zN)[0].toFixed(1)+'" cy="'+P(7,62,zN)[1].toFixed(1)+'" r="4" fill="#ffe9a8" opacity=".9"/>';
  s+='<circle cx="'+P(356,64,zN)[0].toFixed(1)+'" cy="'+P(356,64,zN)[1].toFixed(1)+'" r="4" fill="#ff6a5e" opacity=".9"/>';
  s+='</g>';
  return s;
}

/* ---- 单个部件（含幽灵槽） ---- */
function buildPart(id){
  var b=BOX[id].b, c=BOX[id].c;
  var z0=b[2];
  var solid=box3d(b,c);
  var detail='';
  if (id==='batt'){
    var cells='';
    for (var cx=128; cx<246; cx+=18){
      cells+='<rect x="'+P(cx,42,z0)[0].toFixed(1)+'" y="'+P(cx,42,z0)[1].toFixed(1)+'" width="'+(SCALE*8).toFixed(1)+'" height="'+(SCALE*6).toFixed(1)+'" fill="#ff9f43" fill-opacity=".85"/>';
    }
    detail=cells;
    /* 电量条贴在电池近端侧面上沿 */
    detail+='<rect x="'+P(124,50.5,z0)[0].toFixed(1)+'" y="'+P(124,50.5,z0)[1].toFixed(1)+'" width="'+(SCALE*120).toFixed(1)+'" height="4" rx="2" fill="#16203a"/>';
    detail+='<rect id="socBar" x="'+P(125,51,z0)[0].toFixed(1)+'" y="'+P(125,51,z0)[1].toFixed(1)+'" width="'+(SCALE*118).toFixed(1)+'" height="3" rx="1.5" fill="#41e08d"/>';
  }
  if (id==='gen'){
    detail='<rect x="'+P(66,49,z0)[0].toFixed(1)+'" y="'+P(66,49,z0)[1].toFixed(1)+'" width="5" height="'+(SCALE*14).toFixed(1)+'" fill="url(#gCopper)"/>'
         + '<rect x="'+P(75,49,z0)[0].toFixed(1)+'" y="'+P(75,49,z0)[1].toFixed(1)+'" width="5" height="'+(SCALE*14).toFixed(1)+'" fill="url(#gCopper)"/>';
  }
  if (id==='motor'){
    detail='<path d="M '+ptStr(P(296,54,z0))+' q -12,-12 -26,-2" fill="none" stroke="#ff8c3a" stroke-width="3" stroke-linecap="round"/>';
  }
  var name={tank:'油箱',engine:'发动机',gen:'发电机',gearbox:'变速箱',batt:'动力电池',motor:'电动机'}[id];
  var lbl=P((b[0]+b[3])/2, b[4]+7, 0);   /* 标签放在盒体上方，避免被车轮遮挡 */
  return '<g id="p-'+id+'" class="part3d" style="cursor:pointer">'
       + '<g id="g-'+id+'">'+solid+detail+'</g>'
       + '<text x="'+lbl[0].toFixed(1)+'" y="'+lbl[1].toFixed(1)+'" text-anchor="middle" font-size="12" fill="#aebfd9">'+name+'</text>'
       + '</g>'
       + '<g id="gs-'+id+'" style="display:none">'+ghost3d(b)+'</g>';
}

/* ---- 车轮（3D 圆柱：远端轮圈露边体现厚度，近端圆面 + 旋转辐条） ---- */
function buildWheel(id){
  var w=WHEELS[id];
  var R=SCALE*WR;
  var near=P(w.x,WR,w.z), far=P(w.x,WR,-w.z);
  var s='';
  s+='<circle cx="'+n2(far[0])+'" cy="'+n2(far[1])+'" r="'+n2(R)+'" fill="#10141c" stroke="#232c3c" stroke-width="2"/>';
  s+='<line x1="'+n2(near[0])+'" y1="'+n2(near[1]-R)+'" x2="'+n2(far[0])+'" y2="'+n2(far[1]-R)+'" stroke="#232c3c" stroke-width="2"/>';
  s+='<line x1="'+n2(near[0])+'" y1="'+n2(near[1]+R)+'" x2="'+n2(far[0])+'" y2="'+n2(far[1]+R)+'" stroke="#232c3c" stroke-width="2"/>';
  s+='<circle cx="'+n2(near[0])+'" cy="'+n2(near[1])+'" r="'+n2(R)+'" fill="#14181f" stroke="#2a3242" stroke-width="3"/>';
  var hub=R*0.55;
  var spokes='';
  for (var k=0;k<6;k++){
    var ang=k*60*Math.PI/180;
    spokes+='<line x1="'+n2(near[0])+'" y1="'+n2(near[1])+'" x2="'+n2(near[0]+Math.sin(ang)*hub)+'" y2="'+n2(near[1]-Math.cos(ang)*hub)+'" stroke="#4b566b" stroke-width="3.5" stroke-linecap="round"/>';
  }
  s+='<g id="sp-'+id+'">'
   + '<circle cx="'+n2(near[0])+'" cy="'+n2(near[1])+'" r="'+n2(hub)+'" fill="url(#gMetal)" stroke="#39424f" stroke-width="2"/>'
   + spokes + '</g>';
  s+='<circle cx="'+n2(near[0])+'" cy="'+n2(near[1])+'" r="'+n2(R*0.16)+'" fill="#39424f"/>';
  return s;
}

/* ---- 能量流（3D 折线 + 辉光虚线，画在部件之上保证可见） ---- */
function buildFlows(){
  var c=centers();
  var defs=[
    ['flowY','var(--y)',[c.tank,c.eng,c.gen]],
    ['flowB','var(--b)',[c.gen,c.batt]],
    ['flowG','var(--g)',[c.batt,c.mot,c.rw]],
    ['flowR','var(--r)',[c.eng,c.gb,c.fw]]
  ];
  var s='<g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#fGlow)">';
  for (var i=0;i<defs.length;i++){
    var d=defs[i];
    s+='<path id="'+d[0]+'" class="fl" d="M '+d[2].map(ptStr).join(' L ')+'" stroke="'+d[1]+'" stroke-width="4" stroke-dasharray="10 13" opacity="0"/>';
  }
  s+='</g>';
  return s;
}

/* ---- 标注 ---- */
function buildLabels(){
  var f=P(24,106,-44), rr=P(342,106,-44), mid=P(185,14,-44);
  return '<text x="'+n2(f[0])+'" y="'+n2(f[1])+'" text-anchor="middle" font-size="14" font-weight="700" fill="#ffd27a">车头</text>'
       + '<text x="'+n2(rr[0])+'" y="'+n2(rr[1])+'" text-anchor="middle" font-size="14" font-weight="700" fill="#9fb6e8">车尾</text>'
       + '<text x="'+n2(mid[0])+'" y="'+n2(mid[1])+'" text-anchor="middle" font-size="13" font-weight="600" fill="#bcd4f5">前进方向</text>'
       + '<line x1="'+n2(mid[0]+40)+'" y1="'+n2(mid[1]+13)+'" x2="'+n2(mid[0]-40)+'" y2="'+n2(mid[1]+13)+'" stroke="#7fd0ff" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ah)"/>';
}

/* ---- 组装世界：底座 → 部件 → 车轮 → 能量流 → 玻璃壳 → 标注 ---- */
function buildWorld(){
  var s='';
  s+=bodyBase();
  ['tank','engine','gen','gearbox','batt','motor'].forEach(function(id){ s+=buildPart(id); });
  s+=buildWheel('fw')+buildWheel('rw');
  s+=buildFlows();
  s+=shellGlass();
  s+=buildLabels();
  $('world').innerHTML=s;
}

/* ===== 状态与逻辑 ===== */
var state = { tank:true, engine:true, gen:true, gearbox:true, batt:true, motor:true };
var running=false, shellOn=true, braking=false;
var cur = judge(state);
var spinF=0, spinR=0, dashOff=0, soc=88;

var $ = function(id){ return document.getElementById(id); };

var PART_ICON = {
  tank:  '<rect x="3" y="7" width="28" height="13" rx="5" fill="#48536b"/><rect x="6" y="12" width="22" height="6" rx="2" fill="#f6c445" opacity=".4"/>',
  engine:'<rect x="6" y="5" width="22" height="14" rx="3" fill="#98a4b6"/><rect x="9" y="2" width="16" height="4" rx="1.5" fill="#aab5c5"/><circle cx="7" cy="19" r="3" fill="#77839a"/>',
  gen:   '<rect x="8" y="6" width="18" height="13" rx="4" fill="#98a4b6"/><rect x="11" y="8" width="3.5" height="9" fill="#f2ac62"/><rect x="17" y="8" width="3.5" height="9" fill="#f2ac62"/>',
  gearbox:'<rect x="7" y="6" width="20" height="13" rx="3" fill="#98a4b6"/><circle cx="13" cy="12" r="3" fill="#77839a"/><circle cx="21" cy="12" r="2.5" fill="#77839a"/>',
  batt:  '<rect x="4" y="7" width="26" height="12" rx="2.5" fill="#232b3d" stroke="#46536e"/><rect x="7" y="9" width="4" height="8" fill="#ff9f43"/><rect x="14" y="9" width="4" height="8" fill="#ff9f43"/><rect x="21" y="9" width="4" height="8" fill="#ff9f43"/>',
  motor: '<rect x="8" y="6" width="18" height="13" rx="5" fill="#98a4b6"/><line x1="11" y1="10" x2="23" y2="10" stroke="#77839a" stroke-width="1.5"/><line x1="11" y1="14" x2="23" y2="14" stroke="#77839a" stroke-width="1.5"/>'
};
function buildParts(){
  var html='';
  for (var i=0;i<PARTS.length;i++){
    var p=PARTS[i];
    html+='<div class="pt" data-part="'+p.id+'" title="'+p.desc+'">'
        + '<svg viewBox="0 0 34 24">'+PART_ICON[p.id]+'</svg>'
        + '<div><div class="nm">'+p.name+'</div><div class="st"></div></div></div>';
  }
  $('partsGrid').innerHTML=html;
  var cards=document.querySelectorAll('.pt');
  for (var j=0;j<cards.length;j++){
    cards[j].addEventListener('click', function(){ toggle(this.getAttribute('data-part')); });
  }
}

function toggle(id){
  state[id]=!state[id];
  if (running){ cur=judge(state); if (cur.key==='custom'||cur.key==='empty') stop(); }
  render();
}
function start(){
  cur=judge(state);
  if (['ice','erev','phev','ev'].indexOf(cur.key)<0) return;
  running=true; braking=false;
  $('btnRun').textContent='■ 停止'; $('btnRun').classList.add('stop');
  render();
}
function stop(){
  running=false; braking=false;
  $('btnRun').textContent='▶ 启动'; $('btnRun').classList.remove('stop');
  $('btnBrake').classList.remove('on');
  $('btnBrake').textContent='⚡ 刹车 / 动能回收';
  render();
}

function render(){
  cur=judge(state);
  for (var i=0;i<PARTS.length;i++){
    var p=PARTS[i];
    $('p-'+p.id).style.display = state[p.id] ? '' : 'none';
    $('gs-'+p.id).style.display = state[p.id] ? 'none' : '';
  }
  var mode=MODES[cur.key];
  var flowIds=['flowY','flowB','flowG','flowR'], pathKeys=['Y','B','G','R'];
  var regen = braking && state.batt && state.motor;
  for (var f=0;f<4;f++){
    var on = running && !braking && mode && mode.paths.indexOf(pathKeys[f])>=0;
    $(flowIds[f]).style.opacity = on ? 1 : 0;
  }
  if (regen){ $('flowG').style.opacity=.9; }
  $('flowG').setAttribute('stroke', regen ? 'var(--k)' : 'var(--g)');
  /* 亏电时绿路调暗（电机已无能量输入） */
  if (running && !braking && mode && mode.paths.indexOf('G')>=0 && soc<=6){
    $('flowG').style.opacity=.22;
  }

  var cards=document.querySelectorAll('.pt');
  for (var j=0;j<cards.length;j++){
    var id=cards[j].getAttribute('data-part');
    cards[j].classList.toggle('off', !state[id]);
    cards[j].querySelector('.st').textContent = state[id] ? '已安装' : '未安装';
  }

  if (cur.key==='custom'||cur.key==='empty'){
    $('effMode').textContent = cur.key==='empty' ? '整车未成形' : '自定义组装中';
    $('effVal').textContent='—'; $('effVal').style.color='#8fa2bf';
    $('effChain').textContent = cur.hint||'';
  } else {
    $('effMode').textContent = mode.name;
    $('effVal').innerHTML = running ? (mode.eff+'<span>%</span>') : '—';
    $('effVal').style.color = running ? '#5ee6a0' : '#8fa2bf';
    $('effChain').textContent = mode.chain+'（'+mode.nconv+' 次转化）';
  }

  var h='';
  if (cur.key==='custom'||cur.key==='empty'){
    h+='<div class="row"><span class="badge" style="background:rgba(246,196,69,.14);border-color:rgba(246,196,69,.4);color:#efdca8">'
      +(cur.key==='empty'?'未成形':'组装中')+'</span></div><div class="hint">'+cur.hint+'</div>';
  } else {
    h+='<div class="row"><span class="badge">'+mode.name+'</span>'
      +'<span style="color:var(--dim);font-size:11px;margin-top:4px">总效率约 '+mode.eff+'%（'+mode.nconv+' 次转化）</span></div>';
    for (var r=0;r<mode.rows.length;r++){
      var cc={'Y':'var(--y)','B':'var(--b)','G':'var(--g)','R':'var(--r)'}[mode.rows[r][0]];
      h+='<div class="row"><span class="dot" style="background:'+cc+'"></span><span>'+mode.rows[r][1]+'</span></div>';
    }
    h+='<div class="qa">【预设答案】'+mode.qa+'</div>';
  }
  if (running && braking && state.batt && state.motor){
    h+='<div class="warn" style="background:rgba(55,224,216,.10);border-color:rgba(55,224,216,.35);color:#9ff0ea">⚡ 动能回收中：后轮 → 电动机 → 电池。制动时的机械能经电机转化为电能回充，电量回升。</div>';
  }
  if (running && soc<=6 && mode && mode.paths.indexOf('G')>=0){
    h+='<div class="warn">⚠ 电量耗尽：电动机失去动力，依赖电池驱动的车轮已停止转动。</div>';
  }
  $('infoBody').innerHTML=h;
}

/* ---- 动画 ---- */
var tPrev=0, warnDead=false;
function frame(ts){
  var dt=Math.max(0, Math.min((ts-tPrev)/1000,.05)); tPrev=ts;
  var mode=MODES[cur.key];
  var elecAlive = soc>6;
  /* 亏电警告：状态翻转时才重渲染（避免每帧 innerHTML） */
  var dead = running && !braking && soc<=6 && mode && mode.paths.indexOf('G')>=0;
  if (dead!==warnDead){ warnDead=dead; render(); }
  if (running){
    if (braking){
      /* 动能回收：车轮减速、绿路反向流动、电量回升 */
      dashOff += dt*85;
      spinF *= Math.max(0, 1-dt*1.6);
      spinR *= Math.max(0, 1-dt*1.6);
      if (state.batt && state.motor) soc=Math.min(100, soc+dt*14);
    } else {
      dashOff -= dt*85;
      if (mode){
        if (mode.paths.indexOf('R')>=0) spinF -= dt*240;                 /* 发动机直驱前轮 */
        if (mode.paths.indexOf('G')>=0 && elecAlive) spinR -= dt*290;    /* 电机驱后轮（亏电即停） */
      }
      var charges=(state.gen&&state.engine&&state.tank);
      var drains = mode && mode.paths.indexOf('G')>=0;
      if (drains && !charges) soc=Math.max(0, soc-dt*9);
      else if (charges) soc=Math.min(100, soc+dt*7);
    }
  }
  /* 车轮旋转（圆面在 X-Y 平面，投影后仍为绕圆心旋转） */
  var fwC=P(95,WR,-30), rwC=P(285,WR,-30);
  $('sp-fw').setAttribute('transform','rotate('+spinF.toFixed(1)+' '+n2(fwC[0])+' '+n2(fwC[1])+')');
  $('sp-rw').setAttribute('transform','rotate('+spinR.toFixed(1)+' '+n2(rwC[0])+' '+n2(rwC[1])+')');
  var fl=document.querySelectorAll('.fl');
  for (var i=0;i<fl.length;i++) fl[i].setAttribute('stroke-dashoffset', dashOff.toFixed(1));
  /* 发动机振动 */
  var vib=(running&&state.engine)?('translate('+(Math.sin(ts*.055)*1.3).toFixed(2)+','+(Math.cos(ts*.08)*0.9).toFixed(2)+')'):'';
  $('g-engine').setAttribute('transform', vib);
  /* 电量条（单调变化，不伸缩） */
  var sw=Math.max(2, SCALE*118*soc/100);
  $('socBar').setAttribute('width', sw.toFixed(1));
  $('socBar').setAttribute('fill', soc>30?'#41e08d':(soc>15?'#f6c445':'#ff5f57'));
  requestAnimationFrame(frame);
}

/* ---- 事件 ---- */
$('btnRun').addEventListener('click', function(){ running?stop():start(); });
$('btnBrake').addEventListener('click', function(){
  if (!running) return;
  braking=!braking;
  this.classList.toggle('on', braking);
  this.textContent = braking ? '⚡ 松刹 / 恢复' : '⚡ 刹车 / 动能回收';
  render();
});
$('btnShell').addEventListener('click', function(){
  shellOn=!shellOn;
  var g=$('shellG');
  if (g) g.style.opacity = shellOn ? 1 : .12;
  this.textContent = shellOn ? '外壳：透视中' : '外壳：已隐藏';
});
var p3d=document.querySelectorAll('.part3d');
for (var d=0;d<p3d.length;d++){
  p3d[d].addEventListener('click', function(){ toggle(this.id.replace('p-','')); });
}

buildWorld();
buildParts();
render();
requestAnimationFrame(frame);
</script>
</body>
</html>
