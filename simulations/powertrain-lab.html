<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>汽车动力形式 · 组装实验室</title>
<style>
:root{
  --chem:#e6a83c;
  --elec:#35d6c0;
  --mech:#6aa9ff;
  --line:rgba(255,255,255,.09);
  --line2:rgba(255,255,255,.16);
  --dim:#8fa2bf;
  --txt:#e9eef8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  color:var(--txt);
  background:
    radial-gradient(900px 520px at 10% -10%, #16233c 0%, transparent 62%),
    radial-gradient(760px 480px at 94% 6%, #0f2b33 0%, transparent 60%),
    #070c15;
  overflow:hidden;
  user-select:none;
}
.app{height:100%;display:flex;flex-direction:column;gap:9px;padding:11px 15px 13px}

/* ---------- 头部 ---------- */
header{display:flex;align-items:baseline;gap:14px;flex:0 0 auto}
header h1{font-size:19px;margin:0;letter-spacing:.5px;font-weight:700}
.sub{font-size:12.5px;color:var(--dim);margin:0}
header .sp{flex:1}
button{
  font-family:inherit;font-size:12.5px;cursor:pointer;
  padding:7px 15px;border-radius:9px;
  border:1px solid var(--line2);background:rgba(255,255,255,.05);color:#dbe5f5;
  transition:.16s;
}
button:hover:not(:disabled){background:rgba(255,255,255,.11);border-color:rgba(255,255,255,.28)}
button:disabled{opacity:.38;cursor:not-allowed}
button.primary{
  background:linear-gradient(180deg,#2fc4b0,#149e8b);
  border-color:#37cfba;color:#03130f;font-weight:700;letter-spacing:.5px;
  box-shadow:0 4px 16px rgba(47,196,176,.22);
}
button.primary:hover:not(:disabled){filter:brightness(1.08)}
button.primary.stop{
  background:linear-gradient(180deg,#e2604f,#c2412f);
  border-color:#e2604f;color:#fff;
  box-shadow:0 4px 16px rgba(226,96,79,.2);
}

/* ---------- 零件架 ---------- */
.rack{
  flex:0 0 auto;display:flex;gap:8px;padding:8px;
  background:rgba(255,255,255,.035);
  border:1px solid var(--line);border-radius:13px;
}
.part{
  flex:1;min-width:0;display:flex;align-items:center;gap:9px;
  padding:8px 10px;border-radius:10px;cursor:pointer;
  border:1px solid rgba(255,255,255,.09);
  background:rgba(255,255,255,.025);
  transition:.15s;
}
.part:hover{border-color:rgba(255,255,255,.26);background:rgba(255,255,255,.06)}
.part svg{width:46px;height:32px;flex:0 0 46px}
.part .nm{font-size:13px;font-weight:600;line-height:1.3;white-space:nowrap}
.part .ds{font-size:10.5px;color:var(--dim);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.part .txt{min-width:0}
.part.used{opacity:.26;filter:grayscale(1);border-style:dashed;cursor:default}
.part.used:hover{background:rgba(255,255,255,.025);border-color:rgba(255,255,255,.09)}

/* ---------- 主体 ---------- */
.body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 296px;gap:11px}
.rig{display:flex;flex-direction:column;gap:8px;min-height:0}
.stage{
  position:relative;flex:1;min-height:0;overflow:hidden;
  border:1px solid var(--line);border-radius:14px;
  background:
    linear-gradient(rgba(255,255,255,.021) 1px,transparent 1px) 0 0/100% 26px,
    linear-gradient(90deg,rgba(255,255,255,.021) 1px,transparent 1px) 0 0/26px 100%,
    rgba(255,255,255,.026);
}
#stage{width:100%;height:100%;display:block}
.bar{flex:0 0 auto;display:flex;align-items:center;gap:11px;padding:0 3px;height:36px}
.status{font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status b{color:#cfe4ff;font-weight:600}
.bar .sp{flex:1}
.lg{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--dim);white-space:nowrap}
.lg i{width:14px;height:3px;border-radius:2px;display:inline-block}
.lg i.chem{background:var(--chem)}
.lg i.elec{background:var(--elec)}
.lg i.mech{background:var(--mech)}

/* ---------- 右侧 ---------- */
.side{display:flex;flex-direction:column;gap:10px;min-height:0;overflow:auto}
.card{
  flex:0 1 auto;min-height:0;
  background:rgba(255,255,255,.04);
  border:1px solid var(--line);border-radius:14px;padding:13px 14px;
  overflow:auto;
}
.card.result{position:relative;overflow:hidden}
.card.result::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent,#33415a);
  transition:background .25s;
}
.cname{font-size:16px;font-weight:700;letter-spacing:.3px;line-height:1.3}
.cen{font-size:11px;color:var(--dim);letter-spacing:1.4px;margin-top:1px;height:14px}
.chain{margin:10px 0 0;display:flex;flex-direction:column;gap:6px}
.crow{display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.cn{
  font-size:11.5px;padding:3px 8px;border-radius:6px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);
  white-space:nowrap;
}
.ar{color:#5d708d;font-size:11px}
.desc{font-size:12px;line-height:1.65;color:#b9c8dd;margin:10px 0 0}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.tag{
  font-size:10.5px;padding:2px 8px;border-radius:20px;
  border:1px solid rgba(255,255,255,.13);color:#a9bcd4;
}
.card h2{font-size:12px;color:var(--dim);margin:0 0 9px;font-weight:600;letter-spacing:1px}
.hr{height:1px;background:var(--line);margin:13px 0 12px}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.tasks li{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;line-height:1.45;opacity:.62;transition:.2s;padding:2px 0}
.tasks li .ck{
  width:15px;height:15px;flex:0 0 15px;border-radius:5px;margin-top:1px;
  border:1px solid rgba(255,255,255,.22);
  display:flex;align-items:center;justify-content:center;
  font-size:10px;color:#04140f;
}
.tasks li b{font-weight:600;display:block}
.tasks li em{font-style:normal;font-size:10.5px;color:var(--dim);display:block}
.tasks li.done{opacity:1}
.tasks li.done .ck{background:#35d6c0;border-color:#35d6c0}
.tasks li.done b{color:#7fe8d8}
.taskcard{margin-top:0}

/* ---------- SVG ---------- */
.slot{cursor:pointer}
.slot .frame{
  fill:rgba(255,255,255,.014);
  stroke:rgba(255,255,255,.20);
  stroke-width:1.6;stroke-dasharray:7 6;
  transition:stroke .18s,fill .18s;
}
.slot:hover .frame{stroke:rgba(255,255,255,.42);fill:rgba(255,255,255,.05)}
.slot.filled .frame{stroke-dasharray:none;stroke-width:1.8;fill:rgba(255,255,255,.045)}
.slot.filled:hover .frame{stroke:#ff9a86;fill:rgba(255,120,100,.07)}
.slot.hint .frame{stroke:#58c8ff;stroke-width:2.4;animation:blink 1s ease-in-out infinite}
@keyframes blink{0%,100%{stroke-opacity:.35}50%{stroke-opacity:1}}
.slabel{font-size:14.5px;fill:#7d90ab;font-family:"Microsoft YaHei",sans-serif;letter-spacing:.5px}
.slot:hover .slabel{fill:#b8cae0}
.x{opacity:.32;transition:opacity .15s;pointer-events:none}
.slot.filled:hover .x{opacity:1}
.pop{animation:pop .26s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.92);opacity:.4}100%{transform:scale(1);opacity:1}}

.link{fill:none;stroke:#26303f;stroke-width:2.6;stroke-linecap:round;opacity:.6;transition:stroke .25s,opacity .25s}
.link.armed{opacity:.62;stroke-width:3.2}
.link.armed.chem{stroke:var(--chem)}
.link.armed.elec{stroke:var(--elec)}
.link.armed.mech{stroke:var(--mech)}
.link.on{opacity:1;stroke-dasharray:11 9;animation:dashflow .85s linear infinite}
@keyframes dashflow{to{stroke-dashoffset:-40}}

#spokes{transform-box:view-box;transform-origin:870px 235px}
.stage.running #spokes{animation:spin 1.15s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.note{font-size:10.5px;fill:#5b6c86;font-family:"Microsoft YaHei",sans-serif;letter-spacing:.6px}
.lnote{font-size:11px;fill:#6aa9ff;font-family:"Microsoft YaHei",sans-serif;letter-spacing:.5px;opacity:.85}

/* ---------- 窄屏 ---------- */
@media (max-width:1180px){
  .body{grid-template-columns:minmax(0,1fr) 252px}
  .part svg{width:34px;flex:0 0 34px}
  .part .ds{display:none}
  .card{padding:11px 12px}
  .cname{font-size:15px}
  .desc{font-size:11.5px;line-height:1.55;margin-top:8px}
  .chain{margin-top:8px;gap:5px}
  .cn{font-size:11px;padding:2px 7px}
  .tags{margin-top:7px}
  .hr{margin:10px 0 9px}
  .tasks li{font-size:11.5px;gap:7px;padding:1px 0}
  .slabel{font-size:17px}
  .lnote{font-size:12px}
}
@media (max-width:900px){
  body{overflow:auto}
  .app{height:auto;min-height:100vh}
  .body{display:block}
  .rig{margin-bottom:10px}
  .stage{flex:none;height:auto;aspect-ratio:1000/460}
  .side{overflow:visible}
  .card{overflow:visible}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>汽车动力总成实验室</h1>
    <p class="sub">点零件装到底盘上，点已装的零件拆下来 —— 拆装出四种动力形式</p>
    <span class="sp"></span>
    <button id="btnReset">全部拆下</button>
  </header>

  <div class="rack" id="rack"></div>

  <div class="body">
    <div class="rig">
      <div class="stage" id="stageWrap">
        <svg id="stage" viewBox="0 0 1000 460" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
      <div class="bar">
        <button id="btnRun" class="primary" disabled>启动车辆</button>
        <span class="status" id="status">先装一块动力电池和一台电动机试试</span>
        <span class="sp"></span>
        <span class="lg"><i class="chem"></i>化学能</span>
        <span class="lg"><i class="elec"></i>电能</span>
        <span class="lg"><i class="mech"></i>机械能</span>
      </div>
    </div>

    <aside class="side">
      <div class="card result" id="card">
        <div class="cname" id="cname">未完成装配</div>
        <div class="cen" id="cen"></div>
        <div class="chain" id="chain"></div>
        <p class="desc" id="desc">把零件装到底盘的虚线框里，系统会判断这是哪一种动力形式。</p>
        <div class="tags" id="tags"></div>
        <div class="hr"></div>
        <h2 id="taskTitle">实验任务</h2>
        <ul class="tasks" id="tasks"></ul>
      </div>
    </aside>
  </div>
</div>

<script>
/* =============================================================
   汽车动力形式 · 组装实验室
   把"储能 → 动力装置 → 车轮"拆成可插拔的零件，
   由装配组合自动识别出 BEV / ICE / PHEV / EREV 四种构型。
   ============================================================= */

/* ---------- 零件图标（统一 100×70 坐标系） ---------- */
var ICONS = {
  tank:
    '<g>' +
    '<rect x="7" y="15" width="86" height="44" rx="10" fill="#e6a83c" fill-opacity=".10" stroke="#e6a83c" stroke-width="2.6"/>' +
    '<path d="M22 15 V7 h15 v8" fill="none" stroke="#e6a83c" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>' +
    '<path d="M50 23 c8.5 10.5 13.5 15.5 13.5 22 a13.5 13.5 0 0 1 -27 0 c0-6.5 5-11.5 13.5-22 z" fill="#e6a83c" fill-opacity=".8"/>' +
    '</g>',
  engine:
    '<g>' +
    '<rect x="10" y="17" width="80" height="32" rx="5" fill="#e6a83c" fill-opacity=".10" stroke="#e6a83c" stroke-width="2.6"/>' +
    '<rect x="19" y="24" width="12" height="18" rx="2.5" fill="none" stroke="#e6a83c" stroke-width="1.6" opacity=".5"/>' +
    '<rect x="35" y="24" width="12" height="18" rx="2.5" fill="none" stroke="#e6a83c" stroke-width="1.6" opacity=".5"/>' +
    '<rect x="51" y="24" width="12" height="18" rx="2.5" fill="none" stroke="#e6a83c" stroke-width="1.6" opacity=".5"/>' +
    '<rect x="67" y="24" width="12" height="18" rx="2.5" fill="none" stroke="#e6a83c" stroke-width="1.6" opacity=".5"/>' +
    '<circle cx="50" cy="59" r="7.5" fill="none" stroke="#e6a83c" stroke-width="2.2"/>' +
    '<path d="M50 51.5 V49" stroke="#e6a83c" stroke-width="2.2"/>' +
    '</g>',
  gen:
    '<g>' +
    '<circle cx="42" cy="35" r="24" fill="#6aa9ff" fill-opacity=".10" stroke="#6aa9ff" stroke-width="2.6"/>' +
    '<text x="42" y="43" text-anchor="middle" font-size="20" font-weight="700" fill="#6aa9ff" font-family="Georgia,serif">G</text>' +
    '<rect x="66" y="31" width="24" height="8" rx="3.5" fill="#6aa9ff" fill-opacity=".55"/>' +
    '</g>',
  battery:
    '<g>' +
    '<rect x="9" y="19" width="74" height="38" rx="7" fill="#35d6c0" fill-opacity=".10" stroke="#35d6c0" stroke-width="2.6"/>' +
    '<rect x="83" y="30" width="9" height="16" rx="2.5" fill="#35d6c0"/>' +
    '<path d="M52 24 L39 41 H48 L45 52 L58 35 H49 Z" fill="#35d6c0"/>' +
    '</g>',
  motor:
    '<g>' +
    '<circle cx="42" cy="35" r="24" fill="#6aa9ff" fill-opacity=".10" stroke="#6aa9ff" stroke-width="2.6"/>' +
    '<text x="42" y="43" text-anchor="middle" font-size="20" font-weight="700" fill="#6aa9ff" font-family="Georgia,serif">M</text>' +
    '<rect x="66" y="31" width="24" height="8" rx="3.5" fill="#6aa9ff" fill-opacity=".55"/>' +
    '</g>'
};

/* ---------- 零件 ---------- */
var PARTS = [
  { k:'tank',    nm:'油箱',     ds:'储存汽油' },
  { k:'engine',  nm:'内燃机',   ds:'烧油生动力' },
  { k:'gen',     nm:'发电机',   ds:'转动生电' },
  { k:'battery', nm:'动力电池', ds:'储存电能' },
  { k:'motor',   nm:'电动机',   ds:'电生转动' }
];

/* ---------- 插槽 ---------- */
var SLOTS = [
  { k:'tank',    x:55,  y:79,  w:165, h:112, label:'油箱位' },
  { k:'engine',  x:275, y:74,  w:180, h:122, label:'内燃机位' },
  { k:'gen',     x:520, y:79,  w:155, h:112, label:'发电机位' },
  { k:'battery', x:55,  y:288, w:165, h:112, label:'电池位' },
  { k:'motor',   x:520, y:288, w:155, h:112, label:'电动机位' }
];

/* ---------- 能量通道 ----------
   on(s) 判断这条通路在物理上是否成立（两端都装了、且动力真的走这条路） */
var LINKS = [
  { d:'M220 135 H275',              t:'chem', ends:['tank','engine'],    on:function(s){ return s.tank && s.engine; } },
  { d:'M455 135 H520',              t:'mech', ends:['engine','gen'],     on:function(s){ return s.engine && s.gen; } },
  { d:'M597 191 V288',              t:'elec', ends:['gen','motor'],      on:function(s){ return s.gen && s.motor; } },
  { d:'M220 344 H520',              t:'elec', ends:['battery','motor'],  on:function(s){ return s.battery && s.motor; } },
  { d:'M675 344 L803 300',          t:'mech', ends:['motor'],            on:function(s){ return !!s.motor; } },
  { d:'M365 74 V38 H805 V170',      t:'mech', ends:['engine'],           on:function(s){ return s.engine && !s.gen; } }
];

/* ---------- 车型定义 ---------- */
var CARS = {
  bev: {
    nm:'纯电动汽车', en:'BEV', color:'#35d6c0',
    paths:[['动力电池','电动机','车轮']],
    desc:'电池放电驱动电动机，电动机直接带动车轮。没有内燃机，结构最简单，也没有尾气。',
    tags:['零排放','结构简单','依赖充电']
  },
  ice: {
    nm:'燃油汽车', en:'ICE', color:'#e6a83c',
    paths:[['油箱','内燃机','车轮']],
    desc:'汽油在内燃机里燃烧推动活塞，动力经传动机构直接带动车轮。低速、怠速时效率很低。',
    tags:['补能快','有尾气','效率偏低']
  },
  phev: {
    nm:'插电式混合动力', en:'PHEV', color:'#a78bfa',
    paths:[['动力电池','电动机','车轮'],['油箱','内燃机','车轮']],
    desc:'发动机和电动机都能直接驱动车轮（并联）。电量足时用电，亏电时烧油，两套系统并存。',
    tags:['两套动力','都能直驱','结构复杂']
  },
  erev: {
    nm:'增程式电动车', en:'EREV', color:'#4ade80',
    paths:[['油箱','内燃机','发电机','电池 / 电动机','车轮']],
    desc:'发动机只带动发电机发电，从不直接驱动车轮（串联）。车轮始终由电动机驱动，电池做缓冲。',
    tags:['全程电驱','发动机工况稳定','仍然烧油']
  }
};

var TASKS = [
  { k:'bev',  nm:'装出纯电动车',   hint:'电池 + 电动机' },
  { k:'ice',  nm:'装出燃油车',     hint:'油箱 + 内燃机，不要电动机' },
  { k:'phev', nm:'装出插电混动',   hint:'油和电两套，都不要发电机' },
  { k:'erev', nm:'装出增程式',     hint:'发动机只发电，加上发电机' }
];

/* ---------- 状态 ---------- */
var state = { tank:false, engine:false, gen:false, battery:false, motor:false };
var running = false;
var done = {};
var lastPop = null;

var $ = function(id){ return document.getElementById(id); };

/* ---------- 建静态舞台 ---------- */
(function buildStage(){
  var spokes = '';
  for (var i = 0; i < 5; i++){
    var a = i * 72 * Math.PI / 180;
    spokes += '<line x1="870" y1="235" x2="' + (870 + 58*Math.cos(a)).toFixed(1) +
              '" y2="' + (235 + 58*Math.sin(a)).toFixed(1) +
              '" stroke="#54698a" stroke-width="6" stroke-linecap="round"/>';
  }
  var svg =
    '<defs>' +
      '<linearGradient id="wheelG" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0" stop-color="#2b3a52"/><stop offset="1" stop-color="#121b29"/>' +
      '</linearGradient>' +
    '</defs>' +
    '<g id="gLinks"></g>' +
    '<g id="wheelGroup">' +
      '<circle cx="870" cy="235" r="92" fill="url(#wheelG)" stroke="#3c4d68" stroke-width="10"/>' +
      '<circle cx="870" cy="235" r="76" fill="none" stroke="rgba(255,255,255,.09)" stroke-width="1.5"/>' +
      '<g id="spokes">' + spokes + '</g>' +
      '<circle cx="870" cy="235" r="16" fill="#1a2536" stroke="#6aa9ff" stroke-width="2.5"/>' +
      '<text x="870" y="356" text-anchor="middle" style="font-size:13px;fill:#6d7f99">驱动轮</text>' +
    '</g>' +
    '<g id="gSlots"></g>';
  $('stage').innerHTML = svg;
})();

/* ---------- 判定 ---------- */
function judge(s){
  if (s.tank && s.engine && s.gen && s.motor && s.battery) return 'erev';
  if (s.tank && s.engine && s.motor && s.battery && !s.gen) return 'phev';
  if (s.tank && s.engine && !s.motor && !s.gen && !s.battery) return 'ice';
  if (s.battery && s.motor && !s.tank && !s.engine && !s.gen) return 'bev';
  return null;
}

function hintText(s){
  if (!s.engine && !s.motor) return '底盘上还没有动力装置 —— 先装一台内燃机或电动机';
  if (s.motor && !s.battery && !(s.gen && s.engine)) return '电动机没有电 —— 装一块动力电池';
  if (s.engine && !s.tank) return '内燃机没有燃料 —— 装一个油箱';
  if (s.gen && !s.engine) return '发电机没东西带它转 —— 它需要一台内燃机';
  if (s.tank && !s.engine) return '油箱里的油没处烧 —— 装一台内燃机';
  if (s.battery && !s.motor) return '电池的电没处用 —— 装一台电动机';
  if (s.gen && s.engine && !s.motor) return '发电机发出的电没人用 —— 装一台电动机';
  if (s.gen && s.engine && s.motor && !s.battery) return '增程式也需要一块动力电池做缓冲';
  if (s.engine && s.motor && s.tank && !s.battery) return '还缺一块动力电池';
  return '这个组合还跑不起来 —— 检查一下油路和电路是否接完整';
}

/* ---------- 渲染 ---------- */
function renderRack(){
  var html = '';
  for (var i = 0; i < PARTS.length; i++){
    var p = PARTS[i], used = state[p.k];
    html += '<div class="part' + (used ? ' used' : '') + '" data-part="' + p.k + '">' +
              '<svg viewBox="0 0 100 70">' + ICONS[p.k] + '</svg>' +
              '<div class="txt"><div class="nm">' + p.nm + '</div>' +
              '<div class="ds">' + (used ? '已装上' : p.ds) + '</div></div>' +
            '</div>';
  }
  $('rack').innerHTML = html;
}

function slotMarkup(s){
  var filled = state[s.k];
  var cls = 'slot' + (filled ? ' filled' : '') + (lastPop === s.k ? ' pop' : '');
  var inner = '';
  if (filled){
    var sc = 1.42, iw = 100 * sc, ih = 70 * sc;
    var tx = s.x + (s.w - iw) / 2;
    var ty = s.y + (s.h - ih) / 2 - 4;
    inner = '<g transform="translate(' + tx.toFixed(1) + ',' + ty.toFixed(1) + ') scale(' + sc + ')">' +
              ICONS[s.k] + '</g>' +
            '<g class="x" transform="translate(' + (s.x + s.w - 17) + ',' + (s.y + 17) + ')">' +
              '<circle r="9" fill="rgba(8,14,24,.92)" stroke="rgba(255,255,255,.28)"/>' +
              '<path d="M-3.2 -3.2 L3.2 3.2 M3.2 -3.2 L-3.2 3.2" stroke="#ff9a86" stroke-width="1.8" stroke-linecap="round"/>' +
            '</g>';
  } else {
    inner = '<text x="' + (s.x + s.w/2) + '" y="' + (s.y + s.h/2 + 5) + '" text-anchor="middle" class="slabel">' +
              s.label + '</text>';
  }
  return '<g class="' + cls + '" data-slot="' + s.k + '">' +
           '<rect class="frame" x="' + s.x + '" y="' + s.y + '" width="' + s.w + '" height="' + s.h + '" rx="14"/>' +
           inner +
         '</g>';
}

function renderStage(){
  var links = '';
  for (var i = 0; i < LINKS.length; i++){
    var l = LINKS[i], armed = l.on(state);
    /* 只有「两端都装了件」才画出这条管路；未点亮的灰线表示路存在但不走 */
    var visible = armed || l.ends.every(function(k){ return state[k]; });
    if (!visible) continue;
    links += '<path class="link ' + l.t + (armed ? ' armed' : '') + (armed && running ? ' on' : '') +
             '" d="' + l.d + '"/>';
  }
  if (state.engine && !state.gen){
    links += '<text x="585" y="29" text-anchor="middle" class="lnote">直驱车轮</text>';
  }
  $('gLinks').innerHTML = links;
  var slots = '';
  for (var j = 0; j < SLOTS.length; j++) slots += slotMarkup(SLOTS[j]);
  $('gSlots').innerHTML = slots;
}

function renderCard(key){
  var card = $('card');
  if (!key){
    card.style.setProperty('--accent', '#33415a');
    $('cname').textContent = '未完成装配';
    $('cen').textContent = '';
    $('chain').innerHTML = '';
    $('desc').textContent = hintText(state);
    $('tags').innerHTML = '';
    return;
  }
  var c = CARS[key];
  card.style.setProperty('--accent', c.color);
  $('cname').textContent = c.nm;
  $('cname').style.color = c.color;
  $('cen').textContent = c.en;
  var ch = '';
  for (var i = 0; i < c.paths.length; i++){
    var p = c.paths[i], row = '';
    for (var j = 0; j < p.length; j++){
      if (j) row += '<span class="ar">→</span>';
      row += '<span class="cn">' + p[j] + '</span>';
    }
    ch += '<div class="crow">' + row + '</div>';
  }
  $('chain').innerHTML = ch;
  $('desc').textContent = c.desc;
  var tg = '';
  for (var t = 0; t < c.tags.length; t++) tg += '<span class="tag">' + c.tags[t] + '</span>';
  $('tags').innerHTML = tg;
}

function renderTasks(){
  var n = 0, html = '';
  for (var i = 0; i < TASKS.length; i++){
    var t = TASKS[i], ok = !!done[t.k];
    if (ok) n++;
    html += '<li class="' + (ok ? 'done' : '') + '"><span class="ck">' + (ok ? '✓' : '') + '</span>' +
            '<div><b>' + t.nm + '</b><em>' + t.hint + '</em></div></li>';
  }
  $('tasks').innerHTML = html;
  $('taskTitle').textContent = n === TASKS.length ? '实验任务 · 全部完成 ✓' : '实验任务　' + n + ' / ' + TASKS.length;
}

function renderBar(key){
  var btn = $('btnRun'), st = $('status');
  btn.disabled = !key;
  btn.textContent = running ? '停车' : '启动车辆';
  btn.className = 'primary' + (running ? ' stop' : '');
  if (!key){
    st.innerHTML = hintText(state);
  } else if (running){
    st.innerHTML = '<b>' + CARS[key].nm + '</b> 行驶中，能量正在流动';
  } else {
    st.innerHTML = '已识别为 <b>' + CARS[key].nm + '</b>，点「启动车辆」看能量流向';
  }
}

function render(){
  var key = judge(state);
  if (!key) running = false;
  $('stageWrap').classList.toggle('running', running);
  renderRack();
  renderStage();
  renderCard(key);
  renderTasks();
  renderBar(key);
  lastPop = null;
}

/* ---------- 交互 ---------- */
function toggle(k){
  if (state[k]){
    state[k] = false;
  } else {
    state[k] = true;
    lastPop = k;
  }
  running = false;
  render();
}

$('rack').addEventListener('click', function(e){
  var el = e.target.closest('[data-part]');
  if (!el) return;
  toggle(el.getAttribute('data-part'));
});

$('stage').addEventListener('click', function(e){
  var el = e.target.closest('[data-slot]');
  if (!el) return;
  toggle(el.getAttribute('data-slot'));
});

$('btnRun').addEventListener('click', function(){
  if ($('btnRun').disabled) return;
  running = !running;
  var key = judge(state);
  if (key) done[key] = true;
  render();
});

$('btnReset').addEventListener('click', function(){
  state = { tank:false, engine:false, gen:false, battery:false, motor:false };
  running = false;
  render();
});

render();
</script>
</body>
</html>
