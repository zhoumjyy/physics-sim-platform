<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>限流式与分压式 · 滑动变阻器接法选择</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        background: radial-gradient(circle at 30% 15%, #16384f 0%, #0b1826 58%, #060d16 100%);
        font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
        display: flex; justify-content: center; align-items: stretch;
        padding: 6px; color: #eef4fc; overflow: hidden; font-size: 15px;
    }
    .sim-card {
        width: 100%; max-width: 2400px; height: calc(100vh - 12px);
        background: rgba(18, 34, 50, 0.40);
        backdrop-filter: blur(18px) saturate(180%);
        -webkit-backdrop-filter: blur(18px) saturate(180%);
        border-radius: 20px; border: 1px solid rgba(255,255,255,0.07);
        box-shadow: 0 24px 50px -20px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(255,255,255,0.04);
        display: flex; gap: 10px; padding: 10px; overflow: hidden;
    }

    /* ================= 左侧：参数数据栏 ================= */
    .side {
        flex: 0 0 clamp(250px, 21vw, 330px);
        display: flex; flex-direction: column; gap: 8px;
        min-height: 0; overflow-y: auto; overflow-x: hidden; padding-right: 3px;
    }
    .side::-webkit-scrollbar { width: 6px; }
    .side::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
    .side::-webkit-scrollbar-track { background: transparent; }

    .side-title { font-size: 16px; font-weight: 600; color: #d6e6ff; line-height: 1.25; flex: 0 0 auto; }
    .side-title small { display: block; opacity: 0.45; font-weight: 300; font-size: 11.5px; margin-top: 3px; }

    .panel {
        flex: 0 0 auto;
        background: rgba(10, 20, 32, 0.46); border: 1px solid rgba(255,255,255,0.07);
        border-radius: 14px; padding: 9px 11px 10px;
        display: flex; flex-direction: column; gap: 7px;
    }
    .panel-head { display: flex; align-items: center; gap: 7px; font-size: 13px; color: #cfe2ff; }
    .panel-head .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
    .panel-head .badge { margin-left: auto; }

    /* 一行控制：左标签 + 右数值 */
    .ctl { display: flex; align-items: center; justify-content: space-between; gap: 8px;
        font-size: 12px; color: #86acd4; line-height: 1.3; }
    .ctl b { color: #ffe2a8; font-variant-numeric: tabular-nums; font-weight: 600; font-size: 13.5px; }
    .ctl-line { display: flex; flex-direction: column; gap: 4px; }

    button { font-family: inherit; font-size: 12.5px; color: #eaf2ff; cursor: pointer;
        background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.09);
        border-radius: 9px; padding: 5px 10px; transition: all 0.15s ease; white-space: nowrap; }
    button:hover { background: rgba(255,255,255,0.12); }
    button:active { transform: translateY(1px); }
    button.mini { font-size: 11.5px; padding: 4px 7px; border-radius: 8px; }
    button.active { background: rgba(90,170,255,0.30); border-color: rgba(120,190,255,0.6); color: #fff; }

    input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 7px; border-radius: 5px;
        background: linear-gradient(90deg, #4a8fd8, #2b5a8c); outline: none; cursor: pointer; display: block; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
        background: #eaf2ff; border: 2px solid #4a8fd8; box-shadow: 0 1px 4px rgba(0,0,0,0.5); }
    input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%;
        background: #eaf2ff; border: 2px solid #4a8fd8; }

    .quick { display: flex; gap: 5px; }
    .quick button { flex: 1 1 0; min-width: 0; }

    .badge { font-size: 11px; padding: 2px 9px; border-radius: 20px; white-space: nowrap; }
    .badge.rec { background: rgba(120,210,140,0.25); color: #bff3cf; }
    .badge.no { background: rgba(255,255,255,0.06); color: #8aa0b8; }

    /* 判定结论条 */
    .verdict { color: #cfe2ff; font-size: 12.5px; line-height: 1.5; }
    .verdict b { font-weight: 600; }

    /* 每列结论 */
    .foot { font-size: 11.5px; color: #a9c4e0; line-height: 1.5; }
    .foot b { color: #e6f1ff; }
    .foot .amber { color: #ffd9a8; }
    .foot .blue { color: #a9d6ff; }
    .foot .dim { opacity: .65; }
    .foot .hint { opacity: .62; }
    .sep { height: 1px; background: rgba(255,255,255,0.07); margin: 1px 0; }

    /* ================= 右侧：电路图 + 函数图 ================= */
    .stage {
        flex: 1 1 auto; min-width: 0; min-height: 0;
        display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    }
    .col {
        display: flex; flex-direction: column; min-height: 0; gap: 7px;
        background: rgba(10,20,32,0.42); border: 1px solid rgba(255,255,255,0.06);
        border-radius: 15px; padding: 9px 11px 10px;
    }
    .col-head { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: #cfe2ff; }
    .col-head .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
    .col-head .live { margin-left: auto; font-size: 13px; color: #c7d8ee; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .col-head .live b { color: #ffe2a8; font-size: 14px; }
    .col-head button.mini { margin-left: 6px; }
    .col-head .live + button.mini { margin-left: 8px; }
    .col-head .axis-tag {
        margin-left: 8px; font-size: 11.5px; color: #9fb6d4; white-space: nowrap;
        border: 1px solid rgba(255,255,255,0.10); background: rgba(255,255,255,0.03);
        padding: 2px 7px; border-radius: 7px;
    }

    .circuit-wrap { flex: 0 0 auto; height: clamp(116px, 20vh, 208px); }
    .circuit-wrap svg { width: 100%; height: 100%; display: block; }

    .plot-wrap { flex: 1 1 auto; min-height: 130px; }
    .plot-wrap canvas { width: 100%; height: 100%; display: block; }

    /* 窄屏回落 */
    @media (max-width: 1000px) {
        body { overflow: auto; padding: 6px; }
        .sim-card { height: auto; flex-direction: column; }
        .side { flex: 0 0 auto; overflow: visible; }
        .stage { grid-template-columns: 1fr; }
        .circuit-wrap { height: 170px; }
        .plot-wrap { min-height: 300px; }
    }
    /* 矮屏紧凑模式：收掉辅助说明文字，保证「左侧参数全部可见、页面不滚动」 */
    @media (max-height: 800px) and (min-width: 1001px) {
        .side { gap: 6px; }
        .side-title small { display: none; }
        .panel { padding: 7px 9px 8px; gap: 5px; }
        .foot .hint { display: none; }
        #statusDetail { display: none; }
        .foot .br-extra { display: none; }
        .circuit-wrap { height: clamp(104px, 16.5vh, 162px); }
    }
    /* 更矮的窗口：优先保函数图高度（须写在紧凑模式之后才生效） */
    @media (max-height: 660px) and (min-width: 1001px) {
        .circuit-wrap { height: clamp(96px, 15vh, 150px); }
        .side-title small { display: none; }
        .side { gap: 4px; }
        .side-title { font-size: 14px; }
        .panel { padding: 5px 8px 6px; gap: 4px; }
        .panel-head { font-size: 12.5px; }
        .quick { gap: 4px; }
        .quick button { padding: 3px 5px; font-size: 11px; }
    }
</style>
</head>
<body>
<div class="sim-card">

    <!-- ===================== 左侧：参数数据 ===================== -->
    <div class="side">
        <div class="side-title">
            限流式与分压式
            <small>滑动变阻器接法选择 · 左侧调参数，右侧看电路与函数图像</small>
        </div>

        <!-- 共享参数 -->
        <div class="panel">
            <div class="panel-head"><span class="dot" style="background:#7fd4a8"></span>可调参数</div>
            <div class="ctl-line">
                <div class="ctl"><span>电源电动势 E</span><b id="vE">3.0 V</b></div>
                <input type="range" id="sE" min="1" max="12" step="0.5" value="3" />
            </div>
            <div class="ctl-line">
                <div class="ctl"><span>滑动变阻器 R₀</span><b id="vR0">20.0 Ω</b></div>
                <input type="range" id="sR0" min="0" max="1000" step="1" value="609" />
            </div>
            <div class="ctl-line">
                <div class="ctl"><span>待测电阻 Rₓ</span><b id="vRx">20.0 Ω</b></div>
                <input type="range" id="sRx" min="0" max="1000" step="1" value="609" />
            </div>
            <div class="sep"></div>
            <div class="quick">
                <button class="mini" data-rx="200" data-r0="10">Rₓ ≫ R₀</button>
                <button class="mini" data-rx="50" data-r0="50">Rₓ ≈ R₀</button>
                <button class="mini" data-rx="10" data-r0="200">Rₓ ≪ R₀</button>
            </div>
        </div>

        <!-- 判定结论 -->
        <div class="panel verdict" id="statusPill">…</div>

        <!-- 限流式：滑片 + 结论 -->
        <div class="panel">
            <div class="panel-head">
                <span class="dot" style="background:#ffb86b"></span>限流式接法
                <span class="badge no" id="bL">—</span>
            </div>
            <div class="ctl"><span>本图滑片位置 s</span><b id="vSL">50%</b></div>
            <input type="range" id="sSL" min="0" max="100" step="1" value="50" />
            <div class="foot" id="fL"></div>
        </div>

        <!-- 分压式：滑片 + 结论 -->
        <div class="panel">
            <div class="panel-head">
                <span class="dot" style="background:#5fb0ff"></span>分压式接法
                <span class="badge no" id="bD">—</span>
            </div>
            <div class="ctl"><span>本图滑片位置 s</span><b id="vSD">50%</b></div>
            <input type="range" id="sSD" min="0" max="100" step="1" value="50" />
            <div class="foot" id="fD"></div>
        </div>
    </div>

    <!-- ===================== 右侧：两列 ===================== -->
    <div class="stage">
        <!-- 左：限流式 -->
        <div class="col">
            <div class="col-head">
                <span class="dot" style="background:#ffb86b"></span>限流式接法
                <span class="live">Uₓ = <b id="uL">—</b> V &nbsp; I = <b id="iL">—</b> A &nbsp; R_接 = <b id="rL">—</b> Ω</span>
                <span class="axis-tag" id="axL">横轴：接入阻值 / Ω</span>
            </div>
            <div class="circuit-wrap"><svg id="svgL" viewBox="0 0 500 168" preserveAspectRatio="xMidYMid meet"></svg></div>
            <div class="plot-wrap"><canvas id="cvL"></canvas></div>
        </div>

        <!-- 右：分压式 -->
        <div class="col">
            <div class="col-head">
                <span class="dot" style="background:#5fb0ff"></span>分压式接法
                <span class="live">Uₓ = <b id="uD">—</b> V &nbsp; I = <b id="iD">—</b> A &nbsp; R_接 = <b id="rD">—</b> Ω</span>
                <span class="axis-tag" id="axD">横轴：接入阻值 / Ω</span>
            </div>
            <div class="circuit-wrap"><svg id="svgD" viewBox="0 0 500 168" preserveAspectRatio="xMidYMid meet"></svg></div>
            <div class="plot-wrap"><canvas id="cvD"></canvas></div>
        </div>
    </div>
</div>

<script>
// ============================================================
//  限流式与分压式
//  共享参数：E / R₀ / Rₓ（左侧参数栏）
//  两列各自独立：滑片位置 s → 驱动本列电路图 + 本列函数图
// ============================================================
var E = 3.0, R0 = 20, Rx = 20;
var sL = 0.5, sD = 0.5;                 // 两列各自的滑片位置
var R_MIN = 0.1, R_MAX = 500;

function uLimit(rx, r0, ss){ return rx / (rx + ss * r0); }                        // 限流式 Uₓ/E
function uDiv(rx, r0, ss){ var k = rx / r0; return k * ss / (k + ss * (1 - ss)); } // 分压式 Uₓ/E
function iLimit(rx, r0, ss){ return E / (rx + ss * r0); }                          // 限流式 I (A)
function iDiv(rx, r0, ss){ return E * ss / (rx + ss * (1 - ss) * r0); }            // 分压式 I (A)

function recType(){ return (Rx / R0 >= 5) ? 'div' : 'limit'; }

// ---------- 阻值滑条：对数映射 0.1 ~ 500 Ω ----------
function tToR(t){ return R_MIN * Math.pow(R_MAX / R_MIN, t / 1000); }
function rToT(v){ return 1000 * Math.log(v / R_MIN) / Math.log(R_MAX / R_MIN); }
function fmtR(v){ return v < 10 ? v.toFixed(2) : (v < 100 ? v.toFixed(1) : v.toFixed(0)); }
function fmtI(v){ return Math.abs(v) < 1 ? v.toFixed(3) : v.toFixed(2); }

// ---------- SVG 小工具 ----------
function ln(x1, y1, x2, y2, st, w){ return '<path d="M '+x1+' '+y1+' L '+x2+' '+y2+'" fill="none" stroke="'+(st||'#cdd9e8')+'" stroke-width="'+(w||2)+'" stroke-linecap="round"/>'; }
function node(x, y){ return '<circle cx="'+x+'" cy="'+y+'" r="3.2" fill="#cdd9e8"/>'; }
function txt(x, y, t, o){ o = o || {}; return '<text x="'+x+'" y="'+y+'" fill="'+(o.fill||'#dce8f6')+'" font-size="'+(o.size||12)+'" text-anchor="'+(o.anchor||'middle')+'" font-family="Segoe UI, sans-serif">'+t+'</text>'; }
function circ(x, y, r, fill, st){ return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+(fill||'none')+'" stroke="'+(st||'#cdd9e8')+'" stroke-width="2"/>'; }
function poly(pts, fill){ return '<polygon points="'+pts+'" fill="'+fill+'"/>'; }
function vzig(x, y, len, amp, n){
    var seg = len / (2 * n), pts = [];
    for (var i = 0; i <= 2 * n; i++){
        var t = i * seg, yy = y + t;
        var off = (i === 0 || i === 2 * n) ? 0 : (i % 2 === 1 ? -amp : amp);
        pts.push((x + off).toFixed(1) + ' ' + yy.toFixed(1));
    }
    return 'M ' + pts.join(' L ');
}
function zpath(x, y, len, amp, n){
    return '<path d="'+vzig(x, y, len, amp, n)+'" fill="none" stroke="#cdd9e8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
}
function battery(bx, cy){
    var g = '';
    g += '<line x1="'+(bx-12)+'" y1="'+(cy-8)+'" x2="'+(bx+12)+'" y2="'+(cy-8)+'" stroke="#ffd27a" stroke-width="3"/>';
    g += '<line x1="'+(bx-7)+'" y1="'+(cy+3)+'" x2="'+(bx+7)+'" y2="'+(cy+3)+'" stroke="#9fb6d4" stroke-width="3"/>';
    g += txt(bx+17, cy-4, '+', {fill:'#ffd27a', anchor:'start', size:13});
    g += txt(bx+17, cy+9, '−', {fill:'#9fb6d4', anchor:'start', size:13});
    return g;
}

var RT = 46, RB = 132, XB = 62, XR = 400;   // 上/下导轨、电源竖线、右支路

// ---------- 滑动变阻器几何（限流式；绘制与自检共用）----------
//   真实结构：瓷筒（外面绕电阻丝）在下，金属杆在上，两端各有一个支架；
//   4 个接线柱 = 瓷筒下方的 A（左）/ B（右） + 金属杆两端的 C（左）/ D（右）。
//   限流式「一上一下」接法：导线接 A，再从金属杆一端引出（本图用右端 D）。
function rheoGeom(){
    var RX0 = 150, RX1 = 320;
    return {
        RX0: RX0, RX1: RX1,
        RY: RT - 30,              // 金属杆（上接线柱）高度
        TT: RT - 8, TB: RT + 8,   // 瓷筒（电阻丝）上、下沿
        STUB: RT + 18,            // 下接线柱小柱的下端
        wx: RX0 + sL * (RX1 - RX0) // 滑片位置：A→P 段占全长比例 = sL
    };
}

// ---------- 限流式电路 ----------
function svgLimit(){
    var g = rheoGeom(), e = [], wx = g.wx;
    e.push(ln(XR, RB, XB, RB));
    // 电源
    e.push(ln(XB, RT, XB, 81)); e.push(ln(XB, 92, XB, RB)); e.push(battery(XB, 89));
    e.push(txt(XB, RT - 8, 'E = '+E.toFixed(1)+' V', {fill:'#ffd27a', size:11.5}));
    // 电流表
    e.push(ln(XB, RT, 88, RT));
    e.push(circ(101, RT, 13, 'rgba(20,40,60,0.6)', '#9fd0ff'));
    e.push(txt(101, RT + 4, 'A', {fill:'#9fd0ff', size:12}));
    // 导线：电流表 → 下折 → 接到瓷筒下方的接线柱 A（不是直接搭在电阻丝上）
    e.push(ln(114, RT, 132, RT));
    e.push(ln(132, RT, 132, g.STUB));
    e.push(ln(132, g.STUB, g.RX0, g.STUB));
    // ---- 变阻器本体 ----
    // 瓷筒（电阻丝整体，暗色底）
    e.push('<rect x="'+g.RX0+'" y="'+g.TT+'" width="'+(g.RX1-g.RX0)+'" height="'+(g.TB-g.TT)+'" rx="3" fill="rgba(255,255,255,0.04)" stroke="#45607e" stroke-width="1"/>');
    // 未接入段 P→B：虚线 + 压暗（B 端空置，这段没有电流）
    if (g.RX1 - wx > 1.5){
        e.push('<rect x="'+wx.toFixed(1)+'" y="'+g.TT+'" width="'+(g.RX1-wx).toFixed(1)+'" height="'+(g.TB-g.TT)+'" rx="3" fill="rgba(8,14,24,0.34)" stroke="#3f5a76" stroke-width="1" stroke-dasharray="4 3"/>');
    }
    // 接入段 A→P：琥珀实心高亮
    if (wx - g.RX0 > 1.5){
        e.push('<rect x="'+g.RX0+'" y="'+g.TT+'" width="'+(wx-g.RX0).toFixed(1)+'" height="'+(g.TB-g.TT)+'" rx="3" fill="rgba(255,184,107,0.32)" stroke="#ffb86b" stroke-width="1.2"/>');
    }
    // 金属杆（上接线柱）+ 两端支架
    e.push(ln(g.RX0, g.RY, g.RX1, g.RY, '#9fb6d4', 2.5));
    e.push(ln(wx, g.RY, g.RX1, g.RY, '#ffb86b', 2.5));    // 电流经滑片后在金属杆上流向上接线柱
    e.push(ln(g.RX0, g.RY, g.RX0, g.TT, '#45607e', 2));
    e.push(ln(g.RX1, g.RY, g.RX1, g.TT, '#45607e', 2));
    e.push(circ(g.RX0, g.RY, 2.6, '#9fb6d4', '#9fb6d4'));
    e.push(circ(g.RX1, g.RY, 2.6, '#ffb86b', '#ffb86b'));
    // 滑片：滑块骑在金属杆上 → 连杆 → 触头压在电阻丝上（不再悬空）
    e.push('<rect x="'+(wx-5).toFixed(1)+'" y="'+(g.RY-4)+'" width="10" height="7" rx="2" fill="#ffb86b"/>');
    e.push(ln(wx, g.RY, wx, g.TT - 8, '#ffb86b', 2.5));
    e.push(poly((wx-5).toFixed(1)+' '+(g.TT-8)+' '+(wx+5).toFixed(1)+' '+(g.TT-8)+' '+wx.toFixed(1)+' '+g.TT, '#ffb86b'));
    e.push(circ(wx, g.TT, 2.8, '#ffb86b', '#ffb86b'));
    // 下接线柱 A / B（B 空置）
    e.push(ln(g.RX0, g.TB, g.RX0, g.STUB, '#ffb86b', 2));
    e.push(circ(g.RX0, g.STUB, 2.8, '#ffb86b', '#ffb86b'));
    e.push(ln(g.RX1, g.TB, g.RX1, g.STUB, '#45607e', 2));
    e.push(circ(g.RX1, g.STUB, 2.8, '#45607e', '#45607e'));
    // 引出导线：上接线柱 → 绕到干路 → 接 Rₓ
    e.push(ln(g.RX1, g.RY, 344, g.RY));
    e.push(ln(344, g.RY, 344, RT));
    e.push(ln(344, RT, XR, RT));
    // 标注
    e.push(txt(g.RX0, g.STUB + 13, 'A', {fill:'#ffb86b', size:11}));
    e.push(txt(g.RX1, g.STUB + 13, 'B', {fill:'#5b7da0', size:11}));
    e.push(txt(g.RX1 + 9, g.STUB + 13, '空置（未接线）', {fill:'rgba(150,175,205,0.8)', size:9.5, anchor:'start'}));
    e.push(txt(496, g.RY - 7, '电流：滑片 → 金属杆 → 上接线柱', {fill:'rgba(159,182,212,0.85)', size:9.5, anchor:'end'}));
    e.push(txt(235, g.STUB + 30, '接入电路的是 A→P 段：s·R₀ = '+fmtR(sL*R0)+' Ω', {fill:'#ffb86b', size:11.5}));
    e.push(txt(235, g.STUB + 45, 'R₀ 全阻 = '+fmtR(R0)+' Ω（P→B 段不接入，见虚线部分）', {fill:'#9fb6d4', size:10.5}));
    // 待测电阻 Rₓ
    e.push(ln(XR, RT, XR, 72)); e.push(zpath(XR, 72, 48, 7, 5)); e.push(ln(XR, 120, XR, RB));
    // 电压表（并联在 Rₓ 两端）
    e.push(ln(XR, 72, 452, 72)); e.push(ln(452, 72, 452, 83));
    e.push(circ(452, 96, 13, 'rgba(20,40,60,0.6)', '#ffd27a'));
    e.push(txt(452, 100, 'V', {fill:'#ffd27a', size:12}));
    e.push(ln(452, 109, 452, 120)); e.push(ln(452, 120, XR, 120));
    e.push(txt(XR, RB + 18, 'Rₓ = '+fmtR(Rx)+' Ω', {fill:'#cdd9e8', size:11.5}));
    e.push(node(XB, RT), node(XB, RB), node(XR, RT), node(XR, RB));
    return e.join('');
}

// ---------- 分压式电路 ----------
function svgDiv(){
    var ys = RB - sD * (RB - RT);           // 滑片触点高度（s=0 在下端）
    var len = RB - ys;                      // 并联给 Rₓ 的那一段
    var e = [];
    e.push(ln(XB, RT, XR, RT));
    e.push(ln(XR, RB, XB, RB));
    e.push(ln(XB, RT, XB, 81)); e.push(ln(XB, 92, XB, RB)); e.push(battery(XB, 89));
    e.push(txt(XB, RT - 8, 'E = '+E.toFixed(1)+' V', {fill:'#ffd27a', size:11.5}));
    // 变阻器全阻 R₀ 跨接在电源两端；P→B 段就是分压输出段（= 横轴的接入阻值 R_接）
    if (len > 1.5){
        e.push('<rect x="'+(XR-10)+'" y="'+ys.toFixed(1)+'" width="20" height="'+len.toFixed(1)+'" rx="5" fill="rgba(95,176,255,0.20)"/>');
    }
    e.push(zpath(XR, RT, RB - RT, 7, 7));
    e.push(txt(XR + 13, 100, 'R₀ = '+fmtR(R0)+' Ω', {fill:'#cdd9e8', size:11.5, anchor:'start'}));
    e.push(txt(XR + 13, 115, '输出段 = '+fmtR(sD * R0)+' Ω', {fill:'#5fb0ff', size:10.5, anchor:'start'}));
    // 滑片触头（箭头收窄到电流表右侧，避免被电流表挡住）
    e.push(poly((XR-14)+' '+(ys-5)+' '+(XR-14)+' '+(ys+5)+' '+(XR-4)+' '+ys, '#5fb0ff'));
    e.push(circ(XR, ys, 3.6, '#5fb0ff', '#5fb0ff'));
    // Rₓ 支路：触头 → 电流表 → Rₓ → 下导轨
    e.push(ln(XR, ys, 387, ys));
    e.push(circ(374, ys, 13, 'rgba(20,40,60,0.6)', '#9fd0ff'));
    e.push(txt(374, ys + 4, 'A', {fill:'#9fd0ff', size:12}));
    e.push(ln(361, ys, 350, ys));
    if (len >= 30){
        e.push(ln(350, ys, 350, ys + 8));
        e.push(zpath(350, ys + 8, len - 16, 7, Math.max(2, Math.round((len - 16) / 15))));
        e.push(ln(350, RB - 8, 350, RB));
    } else {
        e.push(ln(350, ys, 350, RB));
    }
    // 电压表（并联在 Rₓ 两端）
    if (len >= 36){
        var cy = (ys + RB) / 2;
        e.push(ln(350, ys, 310, ys)); e.push(ln(310, ys, 310, cy - 13));
        e.push(circ(310, cy, 13, 'rgba(20,40,60,0.6)', '#ffd27a'));
        e.push(txt(310, cy + 4, 'V', {fill:'#ffd27a', size:12}));
        e.push(ln(310, cy + 13, 310, RB)); e.push(ln(310, RB, 350, RB));
    }
    e.push(txt(350, RB + 18, 'Rₓ = '+fmtR(Rx)+' Ω', {fill:'#cdd9e8', size:11.5}));
    e.push(node(XB, RT), node(XB, RB), node(XR, RT), node(XR, RB), node(XR, ys));
    return e.join('');
}

// ---------- 绘图：坐标轴全部线性 ----------
function niceNum(v){
    if (!(v > 0)) return 1;
    var e10 = Math.pow(10, Math.floor(Math.log10(v))), f = v / e10;
    // 细档位：避免 1/2/5 粗跳档把量程撑到峰值的 2 倍以上、导致曲线被压扁
    var steps = [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10];
    for (var i = 0; i < steps.length; i++) if (f <= steps[i] + 1e-9) return steps[i] * e10;
    return 10 * e10;
}
// 横轴刻度文字：接入阻值（Ω）的紧凑写法
function fmtAxisR(v){
    if (Math.abs(v) < 1e-9) return '0';
    if (v >= 100) return String(Math.round(v));
    if (v >= 10) return String(Math.round(v * 10) / 10);
    return String(Math.round(v * 100) / 100);
}
// 函数簇：以 R₀ 为标尺取一组待测电阻（横轴固定为「滑动变阻器接入阻值 R_接 / Ω」）
function rxFamily(){
    var ratios = [0.2, 0.5, 1, 2, 5, 10], arr = [];
    ratios.forEach(function(r){
        var v = R0 * r;
        if (v < R_MIN) v = R_MIN;
        if (v > R_MAX) v = R_MAX;
        var dup = false;
        for (var i = 0; i < arr.length; i++) if (Math.abs(arr[i] - v) < 1e-9) dup = true;
        if (!dup) arr.push(v);
    });
    return arr;
}

// ---------- 绘图：只画「Uₓ 随滑动变阻器接入阻值 R_接 变化」的函数簇 ----------
//   横轴 s = R_接 / R₀ ∈ [0, 1]（刻度按 Ω 标注）；纵轴 Uₓ ∈ [0, E]
//   不再画电流曲线与右轴（避免无关的线干扰"调节范围"这一教学重点）
function drawPlot(cvId, kind, sCur){
    var cv = document.getElementById(cvId); if (!cv) return;
    var ctx = cv.getContext('2d');
    var dpr = window.devicePixelRatio || 1;
    var W = cv.clientWidth, H = cv.clientHeight;
    if (W < 20 || H < 20) return;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    var fam = (kind === 'limit') ? uLimit : uDiv;
    var accent = (kind === 'limit') ? '#ffb86b' : '#5fb0ff';
    var m = {l: 48, r: 22, t: 16, b: 34};
    var x0 = m.l, x1 = W - m.r, y0 = H - m.b, y1 = m.t;

    var xToPx = function(s){ return x0 + s * (x1 - x0); };
    var uToPy = function(u){ return y0 - (u / E) * (y0 - y1); };
    var uAt = function(s){ return E * fam(Rx, R0, s); };

    // ---- 坐标框与网格（线性） ----
    ctx.font = '12px Segoe UI, sans-serif'; ctx.textBaseline = 'alphabetic';
    ctx.strokeStyle = 'rgba(255,255,255,0.20)'; ctx.lineWidth = 1;
    ctx.strokeRect(x0, y1, x1 - x0, y0 - y1);
    var xTicks = 5, k;
    for (k = 1; k < xTicks; k++){
        var gx = x0 + (k / xTicks) * (x1 - x0);
        ctx.strokeStyle = 'rgba(255,255,255,0.08)';
        ctx.beginPath(); ctx.moveTo(gx, y1); ctx.lineTo(gx, y0); ctx.stroke();
    }
    for (k = 1; k <= 5; k++){
        var gy = y0 - (k / 5) * (y0 - y1);
        ctx.strokeStyle = 'rgba(255,255,255,0.08)';
        ctx.beginPath(); ctx.moveTo(x0, gy); ctx.lineTo(x1, gy); ctx.stroke();
    }
    // 刻度数字：全部画在坐标框之外，且必须在 clip() 之前
    ctx.textAlign = 'center'; ctx.fillStyle = '#9fb6d4';
    for (k = 0; k <= xTicks; k++)
        ctx.fillText(fmtAxisR((k / xTicks) * R0), x0 + (k / xTicks) * (x1 - x0), y0 + 15);
    ctx.textAlign = 'right'; ctx.fillStyle = '#c7d8ee';
    for (k = 0; k <= 5; k++)
        ctx.fillText((k / 5 * E).toFixed(1), x0 - 6, y0 - (k / 5) * (y0 - y1) + 4);

    ctx.save(); ctx.beginPath(); ctx.rect(x0, y1, x1 - x0, y0 - y1); ctx.clip();

    function line(fnU, color, width, dash){
        ctx.strokeStyle = color; ctx.lineWidth = width;
        ctx.setLineDash(dash || []);
        ctx.beginPath();
        for (var j = 0; j <= 180; j++){
            var s = j / 180, px = xToPx(s), py = fnU(s);
            if (j === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.stroke(); ctx.setLineDash([]);
    }

    // ---- 淡色函数簇：每条曲线对应一个待测电阻 Rₓ ----
    var famFns = [], famTexts = [];
    rxFamily().forEach(function(rxf){
        if (Math.abs(rxf - Rx) < 0.02 * Rx) return;
        var fnU = function(s){ return E * fam(rxf, R0, s); };
        line(function(s){ return uToPy(fnU(s)); }, 'rgba(190,210,235,0.26)', 1.4, []);
        famFns.push(function(fr){ return uToPy(fnU(fr)); });
        famTexts.push(fmtR(rxf) + 'Ω');
    });
    // 标注横坐标：在所有候选位置里挑「各曲线垂直间距最大」的那个，
    // 这样标出来的数字才真正贴着各自的曲线、不会糊成一团。
    var labFrac = 0.82, bestGap = -1;
    [0.30, 0.40, 0.50, 0.60, 0.68, 0.74, 0.80, 0.86, 0.92].forEach(function(f){
        var ys = famFns.map(function(fn){ return fn(f); }).sort(function(a, b){ return a - b; });
        var mg = 1e9;
        for (var i2 = 1; i2 < ys.length; i2++) mg = Math.min(mg, ys[i2] - ys[i2 - 1]);
        if (ys.length < 2) mg = 0;
        if (mg > bestGap){ bestGap = mg; labFrac = f; }
    });
    var labX = xToPx(labFrac);
    if (labX > x1 - 46) labX = x1 - 46;
    var famLabels = famFns.map(function(fn, i2){ return { y: fn(labFrac), t: famTexts[i2] }; });

    // ---- 当前 Rₓ 对应的那条曲线（加粗） ----
    line(function(s){ return uToPy(uAt(s)); }, accent, 2.8, []);

    // ---- 当前工作点：横坐标 = 本列滑片位置对应的接入阻值 s·R₀ ----
    var cxp = xToPx(sCur);
    ctx.strokeStyle = 'rgba(255,255,255,0.34)'; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(cxp, y1); ctx.lineTo(cxp, y0); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = accent; ctx.beginPath(); ctx.arc(cxp, uToPy(uAt(sCur)), 5, 0, 7); ctx.fill();
    ctx.strokeStyle = '#0b1826'; ctx.lineWidth = 1.6; ctx.stroke();

    // ---- 函数簇曲线标注（标出每条淡色曲线对应的 Rₓ） ----
    if (famLabels.length){
        famLabels.sort(function(a, b){ return a.y - b.y; });
        var bandTop = y1 + 40, bandBot = y0 - 8;     // 上方留两行图例文字
        var gap = Math.min(15, famLabels.length > 1 ? (bandBot - bandTop) / (famLabels.length - 1) : 15);
        for (var fi = 1; fi < famLabels.length; fi++)
            if (famLabels[fi].y - famLabels[fi - 1].y < gap) famLabels[fi].y = famLabels[fi - 1].y + gap;
        var over = famLabels[famLabels.length - 1].y - bandBot;
        if (over > 0) for (var fa = 0; fa < famLabels.length; fa++) famLabels[fa].y -= over;
        if (famLabels[0].y < bandTop){
            var dTop = bandTop - famLabels[0].y;
            for (var fb = 0; fb < famLabels.length; fb++) famLabels[fb].y += dTop;
        }
        ctx.font = '11px Segoe UI, sans-serif';
        ctx.textAlign = 'left';
        ctx.fillStyle = 'rgba(186,208,235,0.85)';
        for (var fj = 0; fj < famLabels.length; fj++){
            var labY = famLabels[fj].y + 4;
            if (labY < y1 + 11) labY = y1 + 11;
            if (labY > y0 - 3) labY = y0 - 3;
            ctx.fillText(famLabels[fj].t, labX, labY);
        }
    }
    ctx.restore();

    // ---- 图例与轴名 ----
    ctx.font = '12px Segoe UI, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillStyle = accent; ctx.fillText('Uₓ / V', x0 + 6, y1 + 13);
    ctx.fillStyle = 'rgba(200,220,245,0.55)';
    ctx.fillText('淡色曲线 = 不同 Rₓ（拖「Rₓ」滑条换曲线，拖本列滑条取工作点）', x0 + 6, y1 + 29);
    ctx.textAlign = 'center'; ctx.fillStyle = '#9fb6d4';
    ctx.fillText('滑动变阻器接入电路的阻值 R_接 / Ω', (x0 + x1) / 2, H - 4);
}

// ---------- 更新 ----------
function update(){
    document.getElementById('vE').textContent = E.toFixed(1) + ' V';
    document.getElementById('vR0').textContent = fmtR(R0) + ' Ω';
    document.getElementById('vRx').textContent = fmtR(Rx) + ' Ω';
    document.getElementById('vSL').textContent = Math.round(sL * 100) + '%';
    document.getElementById('vSD').textContent = Math.round(sD * 100) + '%';
    // 接入阻值 R_接 = s·R₀（即函数图横轴上的工作点横坐标）
    document.getElementById('rL').textContent = fmtR(sL * R0);
    document.getElementById('rD').textContent = fmtR(sD * R0);

    document.getElementById('svgL').innerHTML = svgLimit();
    document.getElementById('svgD').innerHTML = svgDiv();

    var uL = E * uLimit(Rx, R0, sL), iL = iLimit(Rx, R0, sL);
    var uD = E * uDiv(Rx, R0, sD), iDv = iDiv(Rx, R0, sD);
    document.getElementById('uL').textContent = uL.toFixed(2);
    document.getElementById('iL').textContent = fmtI(iL);
    document.getElementById('uD').textContent = uD.toFixed(2);
    document.getElementById('iD').textContent = fmtI(iDv);

    var rec = recType(), k = Rx / R0;
    var bL = document.getElementById('bL'), bD = document.getElementById('bD');
    bL.className = 'badge ' + (rec === 'limit' ? 'rec' : 'no');
    bL.textContent = (rec === 'limit') ? '✓ 推荐' : '—';
    bD.className = 'badge ' + (rec === 'div' ? 'rec' : 'no');
    bD.textContent = (rec === 'div') ? '✓ 推荐' : '—';

    var loL = E * uLimit(Rx, R0, 1);
    var hint = '拖「Rₓ」滑条换曲线 · 拖本列滑条取工作点';
    document.getElementById('fL').innerHTML =
        'Uₓ 可调范围 <b>' + loL.toFixed(2) + ' ~ ' + E.toFixed(1) + ' V</b>（下限不为 0）<br>' +
        '调节幅度占全量程 <b class="amber">' + ((1 - loL / E) * 100).toFixed(1) + '%</b>' +
        (rec === 'div' ? '<span class="br-extra"><br><span class="amber">Rₓ ≫ R₀，区间被压得很窄，几乎调不动。</span></span>' : '') +
        '<div class="hint">（' + hint + '）</div>';
    var hintD = '拖「Rₓ」滑条换曲线 · 拖本列滑条取工作点';
    document.getElementById('fD').innerHTML =
        'Uₓ 可调范围 <b>0 ~ ' + E.toFixed(1) + ' V</b>（恒为全量程，<span class="blue">可从 0 起调</span>）<br>' +
        '代价：干路电流始终 <b>' + fmtI(E / (R0 * (1 - sD) + (Rx * sD * R0) / (Rx + sD * R0))) + ' A</b>，更耗电' +
        '<div class="hint">（' + hintD + '）</div>';

    document.getElementById('statusPill').innerHTML =
        'Rₓ / R₀ = <b>' + k.toFixed(2) + '</b>　→　推荐 <b style="color:' + (rec === 'div' ? '#a9d6ff' : '#ffd9a8') + '">' +
        (rec === 'div' ? '分压式' : '限流式') + '</b><span id="statusDetail"><br><span style="opacity:.62;font-size:11.5px">' +
        (rec === 'div' ? '限流式几乎调节不动（滑片挪到底也改变不了 Uₓ）' : (k < 0.2 ? '此时分压式非线性严重且耗能大' : '更节能、电路更简单；若要求电压从 0 起调则仍须分压式')) +
        '</span></span>';

    document.getElementById('axL').textContent = '横轴：接入阻值 / Ω';
    document.getElementById('axD').textContent = '横轴：接入阻值 / Ω';

    drawPlot('cvL', 'limit', sL);
    drawPlot('cvD', 'div', sD);
}

// ---------- 事件 ----------
function bindRange(id, fn){
    var el = document.getElementById(id);
    el.addEventListener('input', function(){ fn(parseFloat(el.value)); update(); });
}
bindRange('sE', function(v){ E = v; });
bindRange('sR0', function(v){ R0 = tToR(v); });
bindRange('sRx', function(v){ Rx = tToR(v); });
bindRange('sSL', function(v){ sL = v / 100; });
bindRange('sSD', function(v){ sD = v / 100; });

// 快捷按钮：设定共享参数
var presets = document.querySelectorAll('[data-rx]');
for (var pi = 0; pi < presets.length; pi++){
    presets[pi].addEventListener('click', function(){
        Rx = parseFloat(this.getAttribute('data-rx'));
        R0 = parseFloat(this.getAttribute('data-r0'));
        document.getElementById('sRx').value = rToT(Rx);
        document.getElementById('sR0').value = rToT(R0);
        update();
    });
}

// 横轴已固定为「滑动变阻器接入阻值 R_接 / Ω」，故不再有轴切换按钮

window.addEventListener('resize', function(){ update(); });

function init(){
    document.getElementById('sR0').value = rToT(R0);
    document.getElementById('sRx').value = rToT(Rx);
    update();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
