<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>平行板电容器 · 动态变化模拟器</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
        background: radial-gradient(circle at 30% 15%, #16384f 0%, #0b1826 58%, #060d16 100%);
        font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
        display: flex; justify-content: center; align-items: stretch;
        padding: 10px; font-size: 17px; color: #eef4fc; overflow: auto;
    }
    .sim-card {
        width: 100%; max-width: 100%; height: 98vh; min-height: 720px;
        background: rgba(18, 34, 50, 0.40);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        border-radius: 26px;
        border: 1px solid rgba(255, 255, 255, 0.06);
        box-shadow: 0 30px 60px -20px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(255,255,255,0.04);
        display: flex; flex-direction: column; overflow: hidden;
    }

    /* ===== 顶部工具条 ===== */
    .toolbar {
        flex-shrink: 0;
        background: rgba(0,0,0,0.20);
        border-bottom: 1px solid rgba(255,255,255,0.05);
        padding: 9px 16px;
        display: flex; flex-direction: column; gap: 8px;
    }
    .toolbar .row { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
    .toolbar .row.right { margin-left: auto; }
    .toolbar .title { font-size: 19px; font-weight: 600; color: #d6e6ff; display: flex; align-items: center; gap: 9px; margin-right: 8px; }
    .toolbar .title small { opacity: 0.5; font-weight: 300; font-size: 13px; }
    .status {
        font-size: 13px; color: #9fb6d4; background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.05); padding: 5px 13px; border-radius: 30px;
    }
    .status b { color: #ffd27a; }

    .group {
        display: flex; align-items: center; gap: 8px;
        padding: 5px 12px; background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.05); border-radius: 16px;
    }
    .group-label { font-size: 12px; color: #7fa6d0; letter-spacing: 1px; margin-right: 2px; opacity: 0.85; white-space: nowrap; }
    .val { font-size: 13px; color: #ffe2a8; min-width: 54px; text-align: right; font-variant-numeric: tabular-nums; }

    button {
        font-family: inherit; font-size: 13px; color: #eaf2ff; cursor: pointer;
        background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
        border-radius: 10px; padding: 7px 12px; transition: all 0.15s ease; white-space: nowrap;
    }
    button:hover { background: rgba(255,255,255,0.12); }
    button:active { transform: translateY(1px); }
    button.active { background: rgba(90,170,255,0.30); border-color: rgba(120,190,255,0.6); color: #fff; box-shadow: 0 0 14px rgba(90,170,255,0.25); }
    button.mode-charge.active { background: rgba(120,210,140,0.32); border-color: rgba(140,230,160,0.6); box-shadow: 0 0 14px rgba(120,210,140,0.25); }
    button.mode-off.active { background: rgba(255,170,90,0.30); border-color: rgba(255,190,120,0.6); box-shadow: 0 0 14px rgba(255,170,90,0.25); }
    button:disabled { opacity: 0.35; cursor: not-allowed; }

    input[type=range] { -webkit-appearance: none; appearance: none; width: 150px; height: 6px; border-radius: 4px;
        background: linear-gradient(90deg, #4a8fd8, #2b5a8c); outline: none; cursor: pointer; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
        background: #eaf2ff; border: 2px solid #4a8fd8; box-shadow: 0 1px 4px rgba(0,0,0,0.5); }
    input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: #eaf2ff; border: 2px solid #4a8fd8; }

    /* ===== 舞台 ===== */
    .stage { position: relative; flex: 1 1 auto; min-height: 0; }
    #cv { width: 100%; height: 100%; display: block; touch-action: none; }

    .overlay {
        position: absolute; background: rgba(10,20,32,0.62); backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.08);
        border-radius: 16px; padding: 14px 16px; box-shadow: 0 12px 30px -12px rgba(0,0,0,0.7);
    }
    .panel-data { top: 16px; right: 16px; width: 268px; }
    .panel-note { bottom: 16px; left: 16px; width: 340px; font-size: 13px; line-height: 1.55; color: #c7d8ee; }
    .panel-note h4 { font-size: 13px; color: #ffd27a; margin-bottom: 6px; letter-spacing: .5px; }
    .panel-note b { color: #eaf2ff; }
    .panel-data h4 { font-size: 13px; color: #9fd0ff; margin-bottom: 10px; letter-spacing: .5px; display:flex; justify-content:space-between; align-items:center; cursor: move; }
    .panel-note h4 { cursor: move; }
    .grip { opacity: .5; font-size: 11px; letter-spacing: 1px; }
    .panel-data h4 .tag { font-size: 11px; padding: 2px 8px; border-radius: 20px; cursor: default; }
    .tag.charge { background: rgba(120,210,140,0.25); color: #bff3cf; }
    .tag.off { background: rgba(255,170,90,0.22); color: #ffd9a8; }
    .drow { display: flex; justify-content: space-between; align-items: baseline; margin: 7px 0 2px; }
    .drow .k { font-size: 12px; color: #9fb6d4; }
    .drow .v { font-size: 15px; color: #eaf2ff; font-variant-numeric: tabular-nums; font-weight: 600; }
    .bar { height: 6px; border-radius: 4px; background: rgba(255,255,255,0.08); overflow: hidden; margin-bottom: 4px; }
    .bar > i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg,#5fb0ff,#9fe0ff); transition: width 0.12s linear; }
    .bar.q > i { background: linear-gradient(90deg,#ff8a8a,#ffc2c2); }
    .bar.s > i { background: linear-gradient(90deg,#ffb86b,#ffe0a8); }
    .bar.e > i { background: linear-gradient(90deg,#7be0a8,#c4f3d6); }
    .hint { position:absolute; bottom:16px; right:16px; font-size:12px; color:#7fb0d0; opacity:.8; pointer-events:none; text-align:right; }
</style>
</head>
<body>
<div class="sim-card">
    <div class="toolbar">
        <div class="row">
            <div class="title">平行板电容器 · 动态变化 <small>充电 / 断电 · 电容 · 电压 · 电荷 · 电场线</small></div>
            <button id="mCharge" class="mode-charge active">充电（电源接通）</button>
            <button id="mOff" class="mode-off">断电（电源断开）</button>
            <button id="mDiode">接入二极管</button>
            <div class="status" id="statusPill">充电模式 · 电压恒定</div>
            <div class="row right">
                <button id="tMeter" class="active">仪表</button>
                <button id="tData" class="active">数据</button>
                <button id="tNote" class="active">说明</button>
            </div>
        </div>
        <div class="row">
            <div class="group">
                <span class="group-label">正对面积 A</span>
                <input type="range" id="sA" min="100" max="1000" step="10" value="500" />
                <span class="val" id="vA">500 cm²</span>
            </div>
            <div class="group">
                <span class="group-label">极板间距 d</span>
                <input type="range" id="sD" min="1" max="10" step="0.5" value="2" />
                <span class="val" id="vD">2.0 mm</span>
            </div>
            <div class="group">
                <span class="group-label">电介质</span>
                <button class="mat active" data-m="air">空气</button>
                <button class="mat" data-m="wax">石蜡</button>
                <button class="mat" data-m="glass">玻璃</button>
                <button class="mat" data-m="mica">云母</button>
                <button class="mat" data-m="water">纯水</button>
            </div>
            <div class="group">
                <button id="bInsert">插入电介质</button>
            </div>
            <div class="group">
                <span class="group-label">电源电压 V₀</span>
                <input type="range" id="sV" min="1" max="20" step="1" value="10" />
                <span class="val" id="vV">10 V</span>
            </div>
        </div>
        <div class="row">
            <div class="group">
                <span class="group-label">演示</span>
                <button id="p1">① 充电·增大间距</button>
                <button id="p2">② 断电·插电介质</button>
                <button id="p3">③ 断电·增大面积</button>
                <button id="p4">④ 二极管·降压保持</button>
            </div>
            <div class="group">
                <button id="bReset">重置</button>
            </div>
        </div>
    </div>

    <div class="stage">
        <canvas id="cv"></canvas>
        <div class="overlay panel-data" id="panelData">
            <h4 id="dataHeader">实时数据 <span class="tag charge" id="modeTag">充电</span> <span class="grip">⋮⋮拖动</span></h4>
            <div class="drow"><span class="k">电容 C</span><span class="v" id="oC">—</span></div>
            <div class="drow"><span class="k">板间电压 U</span><span class="v" id="oV">—</span></div>
            <div class="drow"><span class="k">极板电荷量 Q</span><span class="v" id="oQ">—</span></div>
            <div class="bar q"><i id="barQ"></i></div>
            <div class="drow"><span class="k">面电荷密度 σ</span><span class="v" id="oS">—</span></div>
            <div class="bar s"><i id="barS"></i></div>
            <div class="drow"><span class="k">板间场强 E</span><span class="v" id="oE">—</span></div>
            <div class="bar e"><i id="barE"></i></div>
            <div class="drow"><span class="k">相对介电 εᵣ</span><span class="v" id="oEps">—</span></div>
        </div>
        <div class="overlay panel-note" id="panelNote">
            <h4 id="noteHeader">物理原理 <span class="grip">⋮⋮拖动</span></h4>
            <div id="noteText"></div>
        </div>
        <div class="hint">拖动极板：横向移动右极板改间距 d；拖极板上/下边改面积 A<br>数据面板/说明面板可拖动标题栏移动位置</div>
    </div>
</div>

<script>
"use strict";
// ============================================================
//  平行板电容器 · 动态变化模拟器（v2）
//  纯 canvas + 原生 JS，零外部依赖，自包含单 HTML，可独立以 iframe 嵌入
// ============================================================
const EPS0 = 8.854e-12; // F/m
const MATERIALS = {
    air:   { name: '空气 / 真空', er: 1.0,  color: '#bfe3ff' },
    wax:   { name: '石蜡',        er: 2.1,  color: '#ffd27a' },
    glass: { name: '玻璃',        er: 5.0,  color: '#a9e7ff' },
    mica:  { name: '云母',        er: 6.0,  color: '#b9f0c8' },
    water: { name: '纯水',        er: 78.0, color: '#5fd0e6' }
};
const MAXANG = 55 * Math.PI / 180;

// ---------- 状态 ----------
const state = {
    mode: 'charge',        // 'charge' | 'off'
    diode: false,          // 是否接入二极管（单向阀）
    A: 500,                // cm²
    d: 2.0,                // mm
    material: 'air',       // 当前介质材料 key
    inserted: false,       // 是否已插入介质
    V0: 10,                // 电源电压 V（充电模式）
    Qfix: null             // 断电时冻结的电荷量 C
};

// 动画显示量
const disp = { A: 500, d: 2.0, er: 1.0, slab: 0, V: 10, Q: 0, sigma: 0, E: 0, needle: 0, emFull: 20 };
let actualQ = null;        // 当前积分电荷（含二极管保持逻辑）
let flowDir = 0;           // +1 电荷流入电容, -1 流出, 0 无
let chargePhase = 0;

// 参考量
const SIG_REF = physRefSigma();
const E_REF   = physRefE();
const Q_REF   = physRefQ();

// ---------- 纯物理函数（供自检调用） ----------
function physFromParams(p) {
    const A = p.A_cm2 * 1e-4, d = p.d_mm * 1e-3;
    const C = EPS0 * p.er * A / d;
    let V, Q;
    if (p.mode === 'charge') { V = p.V0; Q = C * V; }
    else { Q = (p.Qfix != null ? p.Qfix : C * p.V0); V = Q / C; }
    const sigma = Q / A, E = V / d;
    return { A, d, C, V, Q, sigma, E };
}
// 通用模型：给定上一刻电荷 Qprev，返回当前目标 {C,V,Q}
function computeTarget(Qprev, p) {
    const A = p.A_cm2 * 1e-4, d = p.d_mm * 1e-3;
    const C = EPS0 * p.er * A / d;
    let V, Q;
    if (p.mode === 'off') {
        Q = (p.Qfix != null ? p.Qfix : C * p.V0); V = Q / C;
    } else if (!p.diode) {
        V = p.V0; Q = C * p.V0;                 // 电源钳位电压
    } else {
        const Qfree = C * p.V0;                 // 电源“希望”的电荷
        Q = (Qfree >= Qprev) ? Qfree : Qprev;   // 二极管单向阀：仅允许电荷流入
        V = Q / C;
    }
    return { C, V, Q };
}
function physRefSigma() { return physFromParams({ A_cm2: 500, d_mm: 2, er: 1, mode: 'charge', V0: 10 }).sigma; }
function physRefE()     { return physFromParams({ A_cm2: 500, d_mm: 1, er: 1, mode: 'charge', V0: 20 }).E; }
function physRefQ()     { return physFromParams({ A_cm2: 1000, d_mm: 1, er: 1, mode: 'charge', V0: 20 }).Q; }

// 电场线数量映射（σ 越小越稀疏）—— 暴露给自检
function fieldLineCount(sigma) {
    return Math.round(clamp(4 + 30 * (sigma / SIG_REF), 4, 34));
}

// ============================================================
//  画布与几何
// ============================================================
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let cssW = 800, cssH = 600, dpr = 1;

function resize() {
    const r = cv.getBoundingClientRect();
    cssW = Math.max(320, r.width); cssH = Math.max(320, r.height);
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
if (typeof ResizeObserver !== 'undefined') { new ResizeObserver(resize).observe(cv); }
else window.addEventListener('resize', resize);

// ---------- 工具 ----------
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function niceCeil(x) {
    if (x <= 0) return 1;
    const e = Math.floor(Math.log10(x)), b = Math.pow(10, e), m = x / b;
    let n; if (m <= 1) n = 1; else if (m <= 2) n = 2; else if (m <= 5) n = 5; else n = 10;
    return n * b;
}
function fmtC(C){ if(C>=1e-9) return (C*1e9).toFixed(2)+' nF'; if(C>=1e-12) return (C*1e12).toFixed(1)+' pF'; return (C*1e15).toFixed(1)+' fF'; }
function fmtQ(Q){ Q=Math.abs(Q); if(Q>=1e-9) return (Q*1e9).toFixed(2)+' nC'; if(Q>=1e-12) return (Q*1e12).toFixed(1)+' pC'; return (Q*1e15).toFixed(1)+' fC'; }
function fmtS(s){ s=Math.abs(s); if(s>=1e-6) return (s*1e6).toFixed(2)+' μC/m²'; if(s>=1e-9) return (s*1e9).toFixed(1)+' nC/m²'; return (s*1e12).toFixed(1)+' pC/m²'; }
function fmtE(E){ if(E>=1000) return (E/1000).toFixed(1)+' kV/m'; return E.toFixed(0)+' V/m'; }
function fmtV(v){ return v.toFixed(1)+' V'; }

function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
}
function polyAt(pts, t) {
    let total = 0; const segs = [];
    for (let i = 0; i < pts.length - 1; i++) { const L = Math.hypot(pts[i+1].x-pts[i].x, pts[i+1].y-pts[i].y); segs.push(L); total += L; }
    let d = t * total;
    for (let i = 0; i < segs.length; i++) {
        if (d <= segs[i] || i === segs.length - 1) { const f = segs[i] ? d / segs[i] : 0;
            return { x: pts[i].x + (pts[i+1].x-pts[i].x)*f, y: pts[i].y + (pts[i+1].y-pts[i].y)*f }; }
        d -= segs[i];
    }
    return pts[pts.length - 1];
}
function hexA(hex, a) {
    const h = hex.replace('#', '');
    const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}

// ============================================================
//  绘制：背景 / 台座 / 支柱 / 极板 / 介质 / 电荷 / 电场线
// ============================================================
function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, cssH);
    g.addColorStop(0, 'rgba(20,40,60,0.0)');
    g.addColorStop(1, 'rgba(4,10,18,0.35)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, cssW, cssH);
    const by = cssH * 0.86;
    const bg = ctx.createLinearGradient(0, by, 0, cssH);
    bg.addColorStop(0, '#3a2c20'); bg.addColorStop(0.06, '#2a2018'); bg.addColorStop(1, '#171210');
    ctx.fillStyle = bg; ctx.fillRect(0, by, cssW, cssH - by);
    ctx.strokeStyle = 'rgba(255,220,180,0.10)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, by); ctx.lineTo(cssW, by); ctx.stroke();
}
function drawBase(cx, baseY) {
    const w = cssW * 0.86, x = (cssW - w) / 2;
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 6;
    const g = ctx.createLinearGradient(0, baseY, 0, baseY + 16);
    g.addColorStop(0, '#5a4632'); g.addColorStop(1, '#37291c');
    ctx.fillStyle = g; roundRect(x, baseY, w, 16, 6); ctx.fill();
    ctx.restore();
}
function drawSupport(x, topY, baseY) {
    ctx.save();
    const g = ctx.createLinearGradient(0, topY, 0, baseY);
    g.addColorStop(0, '#caa15a'); g.addColorStop(1, '#8a6a32');
    ctx.fillStyle = g;
    ctx.fillRect(x - 5, topY - 6, 10, baseY - topY + 6);
    ctx.fillStyle = '#6f5526'; ctx.fillRect(x - 9, baseY - 4, 18, 8);
    ctx.restore();
}
// 极板（金属，带高光与边缘倒角）
function drawPlate(x, topY, botY, positive) {
    const w = 18;
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = 14; ctx.shadowOffsetX = 4;
    const g = ctx.createLinearGradient(x - w/2, 0, x + w/2, 0);
    if (positive) { g.addColorStop(0, '#9aa6b4'); g.addColorStop(0.4, '#e7eef6'); g.addColorStop(0.5, '#ffffff'); g.addColorStop(0.6, '#cdd8e4'); g.addColorStop(1, '#7e8a98'); }
    else { g.addColorStop(0, '#9aa6b4'); g.addColorStop(0.4, '#dfe8f2'); g.addColorStop(0.5, '#f4f8ff'); g.addColorStop(0.6, '#c4d0de'); g.addColorStop(1, '#7e8a98'); }
    ctx.fillStyle = g; roundRect(x - w/2, topY, w, botY - topY, 4); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x - w/2 + 2, topY + 2); ctx.lineTo(x - w/2 + 2, botY - 2); ctx.stroke();
    // 顶部接线柱
    ctx.save();
    const tg = ctx.createLinearGradient(0, topY - 30, 0, topY);
    tg.addColorStop(0, '#e9c87a'); tg.addColorStop(1, '#9c7a2e');
    ctx.fillStyle = tg; ctx.beginPath(); ctx.arc(x, topY - 22, 5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(120,120,130,0.9)'; ctx.fillRect(x - 3, topY - 26, 6, 6);
    ctx.restore();
}
function drawDielectric(pxL, pxR, topY, botY) {
    if (disp.slab <= 0.02) return;
    const m = MATERIALS[state.material];
    const x = pxL + 4, w = (pxR - pxL) - 8;
    const fullH = botY - topY;
    const covered = topY + fullH * disp.slab;
    ctx.save();
    const g = ctx.createLinearGradient(x, 0, x + w, 0);
    g.addColorStop(0, hexA(m.color, 0.30)); g.addColorStop(0.5, hexA(m.color, 0.16)); g.addColorStop(1, hexA(m.color, 0.32));
    ctx.fillStyle = g; roundRect(x, topY + 2, w, covered - topY - 4, 3); ctx.fill();
    ctx.strokeStyle = hexA(m.color, 0.6); ctx.lineWidth = 1.2; roundRect(x, topY + 2, w, covered - topY - 4, 3); ctx.stroke();
    ctx.strokeStyle = hexA(m.color, 0.18); ctx.lineWidth = 1;
    for (let yy = topY + 10; yy < covered - 6; yy += 12) { ctx.beginPath(); ctx.moveTo(x + 4, yy); ctx.lineTo(x + w - 4, yy - 6); ctx.stroke(); }
    ctx.restore();
}
function drawCharges(pxL, pxR, pt, topY, botY) {
    const sp = clamp(70 * Math.sqrt(SIG_REF / Math.max(disp.sigma, 1e-12)), 12, 64);
    const xP = pxL + pt/2 + 6, xM = pxR - pt/2 - 6;
    ctx.save(); ctx.lineWidth = 2; ctx.lineCap = 'round';
    const r = 4.2;
    for (let y = topY + 12; y <= botY - 12; y += sp) {
        ctx.strokeStyle = '#ff7a7a';
        ctx.beginPath(); ctx.moveTo(xP - r, y); ctx.lineTo(xP + r, y);
        ctx.moveTo(xP, y - r); ctx.lineTo(xP, y + r); ctx.stroke();
        ctx.strokeStyle = '#7ab0ff';
        ctx.beginPath(); ctx.moveTo(xM - r, y); ctx.lineTo(xM + r, y); ctx.stroke();
    }
    ctx.restore();
}
function drawFieldLines(pxL, pxR, pt, topY, botY) {
    const nL = fieldLineCount(disp.sigma);
    const x0 = pxL + pt/2, x1 = pxR - pt/2;
    const alpha = clamp(0.25 + 0.55 * (disp.E / E_REF), 0.18, 0.85);
    ctx.save();
    ctx.strokeStyle = 'rgba(180,225,255,' + alpha.toFixed(3) + ')';
    ctx.lineWidth = 1.4; ctx.lineCap = 'round';
    for (let i = 0; i < nL; i++) {
        const y = topY + 8 + (botY - topY - 16) * (i + 0.5) / nL;
        ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
        const ax = (x0 + x1) / 2;
        ctx.beginPath(); ctx.moveTo(ax, y); ctx.lineTo(ax - 5, y - 4); ctx.moveTo(ax, y); ctx.lineTo(ax - 5, y + 4); ctx.stroke();
    }
    ctx.restore();
    return nL;
}
function drawGlow(pxL, pxR, topY, botY) {
    const a = clamp(0.05 + 0.20 * (disp.E / E_REF), 0.04, 0.30);
    const g = ctx.createLinearGradient(pxL, 0, pxR, 0);
    g.addColorStop(0, 'rgba(255,120,120,' + a + ')');
    g.addColorStop(0.5, 'rgba(180,220,255,' + (a*0.7) + ')');
    g.addColorStop(1, 'rgba(120,160,255,' + a + ')');
    ctx.save(); ctx.fillStyle = g;
    roundRect(pxL + 9, topY + 4, (pxR - pxL) - 18, botY - topY - 8, 4); ctx.fill();
    ctx.restore();
}

// ============================================================
//  导线 / 开关 / 二极管 / 电源 / 静电计（实物质感）
// ============================================================
function drawWire(pts, withFlow, color, phase) {
    ctx.save();
    ctx.strokeStyle = '#2c333d'; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();
    ctx.strokeStyle = '#566273'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();
    ctx.restore();
    if (withFlow) {
        ctx.save(); ctx.fillStyle = color;
        for (let i = 0; i < 6; i++) {
            const t = (phase + i / 6) % 1;
            const p = polyAt(pts, t);
            ctx.beginPath(); ctx.arc(p.x, p.y, 3.2, 0, Math.PI*2); ctx.fill();
        }
        ctx.restore();
    }
}
// 断点（开路标记，画在导线末端）
function drawOpenEnd(a, b, sign) {
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    ctx.save();
    ctx.fillStyle = 'rgba(255,180,90,0.95)'; ctx.font = 'bold 18px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('✕', mx, my + 6);
    ctx.restore();
}
// 开关：闭合(charge) 导通，断开(off) 可见断口
function drawSwitch(closed, x, y) {
    const L = 26;
    const p1 = { x: x - L/2, y: y }, p2 = { x: x + L/2, y: y };
    ctx.save();
    // 两个接线柱
    ctx.fillStyle = '#caa15a';
    ctx.beginPath(); ctx.arc(p1.x, p1.y, 4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(p2.x, p2.y, 4, 0, Math.PI*2); ctx.fill();
    // 刀闸
    if (closed) {
        ctx.strokeStyle = '#e8c87a'; ctx.lineWidth = 4; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
    } else {
        ctx.strokeStyle = '#e8c87a'; ctx.lineWidth = 4; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p1.x + L*0.42, p1.y - 16); ctx.stroke();
        ctx.fillStyle = 'rgba(255,180,90,0.95)'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('⏻', p2.x, p2.y - 8);
    }
    ctx.restore();
}
// 二极管（三角形+竖杠），forward 指向右侧(+x)
function drawDiode(x, y, active) {
    ctx.save();
    const s = 9;
    // 三角形（指向右=正向导通，允许电荷流入电容）
    ctx.fillStyle = active ? '#7be0a8' : 'rgba(150,160,170,0.6)';
    ctx.beginPath();
    ctx.moveTo(x - s, y - s); ctx.lineTo(x - s, y + s); ctx.lineTo(x + s*0.2, y); ctx.closePath(); ctx.fill();
    // 竖杠（阴极）
    ctx.strokeStyle = active ? '#7be0a8' : 'rgba(150,160,170,0.6)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x + s*0.2, y - s); ctx.lineTo(x + s*0.2, y + s); ctx.stroke();
    // 引脚
    ctx.strokeStyle = '#566273'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x - s - 6, y); ctx.lineTo(x - s, y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + s*0.2, y); ctx.lineTo(x + s + 6, y); ctx.stroke();
    if (active) {
        ctx.fillStyle = 'rgba(123,224,168,0.95)'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('二极管', x, y - s - 6);
    }
    ctx.restore();
}
// 直流电源（蓄电池，实物质感）
function drawBattery(bx, by) {
    const w = 70, h = 104;
    const x = bx - w/2, y = by - h/2;
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 8;
    const g = ctx.createLinearGradient(x, 0, x + w, 0);
    g.addColorStop(0, '#161d27'); g.addColorStop(0.16, '#38485a'); g.addColorStop(0.5, '#587089');
    g.addColorStop(0.84, '#2b3744'); g.addColorStop(1, '#10161e');
    ctx.fillStyle = g; roundRect(x, y, w, h, 14); ctx.fill();
    ctx.restore();
    // 四角螺钉
    ctx.fillStyle = '#c9b27a';
    [[x+9,y+9],[x+w-9,y+9],[x+9,y+h-9],[x+w-9,y+h-9]].forEach(p=>{ ctx.beginPath(); ctx.arc(p[0],p[1],3,0,Math.PI*2); ctx.fill(); });
    // 外壳高光
    ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 1; roundRect(x+3, y+3, w-6, h-6, 11); ctx.stroke();
    // 电池环纹
    ctx.strokeStyle = 'rgba(0,0,0,0.30)'; ctx.lineWidth = 2;
    for (let i = 1; i < 4; i++) { const yy = y + h*i/4; ctx.beginPath(); ctx.moveTo(x+6, yy); ctx.lineTo(x+w-6, yy); ctx.stroke(); }
    // 顶部 + 端子（红）
    ctx.save();
    const tg = ctx.createLinearGradient(0, y-22, 0, y-4);
    tg.addColorStop(0, '#ffd9d9'); tg.addColorStop(1, '#c0392b');
    ctx.fillStyle = tg; roundRect(bx-7, y-20, 14, 16, 4); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#ff8a8a'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('+', bx, y-6);
    // 底部 − 端子（黑）
    ctx.save();
    const bg = ctx.createLinearGradient(0, y+h+4, 0, y+h+22);
    bg.addColorStop(0, '#3a3a3a'); bg.addColorStop(1, '#0d0d0d');
    ctx.fillStyle = bg; roundRect(bx-7, y+h+4, 14, 16, 4); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#cfcfcf'; ctx.font = 'bold 16px sans-serif';
    ctx.fillText('−', bx, y+h+20);
    // 标签
    ctx.fillStyle = '#dbe7f5'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('直流电源', bx, by - 14);
    ctx.fillStyle = '#ffd27a'; ctx.font = 'bold 13px sans-serif';
    ctx.fillText('V₀ = ' + state.V0 + ' V', bx, by + 6);
    ctx.fillStyle = '#9fb6d4'; ctx.font = '10px sans-serif';
    ctx.fillText('（蓄电池）', bx, by + 22);
}
// 静电计（模拟表头 + 顶部金属球，实物质感）
function drawElectrometer(ex, ey) {
    const cw = 78, ch = 104;
    const x = ex - cw/2, y = ey - ch/2 + 6;
    // 表壳
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 16; ctx.shadowOffsetY = 6;
    const g = ctx.createLinearGradient(x, 0, x + cw, 0);
    g.addColorStop(0, '#2a323c'); g.addColorStop(0.5, '#5b6c7e'); g.addColorStop(1, '#222a32');
    ctx.fillStyle = g; roundRect(x, y, cw, ch, 12); ctx.fill();
    ctx.restore();
    // 黄铜外圈
    ctx.strokeStyle = '#caa15a'; ctx.lineWidth = 4; roundRect(x+3, y+3, cw-6, ch-6, 9); ctx.stroke();
    // 表盘
    const cxD = ex, cyD = y + ch*0.50, R = 30;
    const fg = ctx.createRadialGradient(cxD-6, cyD-8, 3, cxD, cyD, R);
    fg.addColorStop(0, '#fbf6e8'); fg.addColorStop(1, '#d9cdb0');
    ctx.fillStyle = fg; ctx.beginPath(); ctx.arc(cxD, cyD, R, 0, Math.PI*2); ctx.fill();
    // 刻度弧
    ctx.strokeStyle = '#5a4a2a'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(cxD, cyD, R-4, -Math.PI*0.92, -Math.PI*0.08); ctx.stroke();
    for (let i = 0; i <= 10; i++) {
        const a = -Math.PI*0.92 + (Math.PI*0.84) * i / 10;
        const r1 = (i % 5 === 0) ? R-9 : R-6;
        const x1 = cxD + Math.cos(a)*r1, y1 = cyD + Math.sin(a)*r1;
        const x2 = cxD + Math.cos(a)*(R-3), y2 = cyD + Math.sin(a)*(R-3);
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    }
    // 指针
    const angT = clamp((disp.V / disp.emFull) * MAXANG * 2 - MAXANG, -MAXANG, MAXANG);
    const a = -Math.PI/2 + angT;
    const nx = cxD + Math.cos(a) * (R-7), ny = cyD + Math.sin(a) * (R-7);
    ctx.strokeStyle = '#d23b3b'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cxD, cyD); ctx.lineTo(nx, ny); ctx.stroke();
    ctx.fillStyle = '#3a2c10'; ctx.beginPath(); ctx.arc(cxD, cyD, 3.2, 0, Math.PI*2); ctx.fill();
    // 玻璃反光
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    ctx.beginPath(); ctx.arc(cxD, cyD, R, Math.PI*1.05, Math.PI*1.4); ctx.fill();
    // 数值
    ctx.fillStyle = '#1a1a1a'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(fmtV(disp.V), cxD, cyD + R - 2);
    ctx.fillStyle = '#5a4a2a'; ctx.font = '9px sans-serif';
    ctx.fillText('满量程 ' + disp.emFull.toFixed(0) + 'V', cxD, cyD + R + 8);
    // 顶部金属球（静电计球）
    const sy = y - 14;
    const sg = ctx.createRadialGradient(ex-4, sy-4, 2, ex, sy, 13);
    sg.addColorStop(0, '#fff4d8'); sg.addColorStop(1, '#b8902f');
    ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(ex, sy, 12, 0, Math.PI*2); ctx.fill();
    // 连杆（球→表壳）
    ctx.strokeStyle = '#caa15a'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(ex, sy+11); ctx.lineTo(ex, y); ctx.stroke();
    // 底部接地端子
    ctx.fillStyle = '#caa15a'; ctx.beginPath(); ctx.arc(ex, y+ch, 4, 0, Math.PI*2); ctx.fill();
    // 标签
    ctx.fillStyle = '#9fd0ff'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('静电计', ex, y - 30);
}

// ============================================================
//  主循环
// ============================================================
function frame() {
    const tEr = state.inserted ? MATERIALS[state.material].er : 1.0;
    const tSlab = state.inserted ? 1 : 0;
    disp.A += (state.A - disp.A) * 0.15;
    disp.d += (state.d - disp.d) * 0.15;
    disp.er += (tEr - disp.er) * 0.12;
    disp.slab += (tSlab - disp.slab) * 0.12;

    const A = disp.A * 1e-4, d = disp.d * 1e-3;
    const C = EPS0 * disp.er * A / d;
    const p = { A_cm2: disp.A, d_mm: disp.d, er: disp.er, mode: state.mode, V0: state.V0, Qfix: state.Qfix, diode: state.diode };
    const prevQ = (actualQ == null) ? 0 : actualQ;
    const tgt = computeTarget(actualQ == null ? (state.mode==='off' ? (state.Qfix!=null?state.Qfix:C*state.V0) : C*state.V0) : actualQ, p);
    actualQ = tgt.Q;
    disp.Q += (tgt.Q - disp.Q) * 0.18;
    disp.V += (tgt.V - disp.V) * 0.18;
    disp.sigma = disp.Q / A;
    disp.E = disp.V / d;
    flowDir = Math.sign(tgt.Q - prevQ);

    // 静电计
    const emT = niceCeil(Math.max(5, Math.abs(disp.V) * 1.12));
    disp.emFull += (emT - disp.emFull) * 0.1;
    const angT = clamp((disp.V / disp.emFull) * MAXANG, -MAXANG * 0.25, MAXANG);
    disp.needle += (angT - disp.needle) * 0.15;

    // 电荷流动相位
    if (flowDir !== 0) chargePhase = (chargePhase + 0.04 * (state.mode==='charge'?1:1)) % 1;

    render();
    updatePanel();
    requestAnimationFrame(frame);
}

function render() {
    ctx.clearRect(0, 0, cssW, cssH);
    drawBackground();

    const cx = cssW * 0.46, cy = cssH * 0.52;
    const baseY = cssH * 0.86;
    const plateH = lerp(cssH * 0.30, cssH * 0.62, (disp.A - 100) / 900);
    const gap = lerp(cssW * 0.045, cssW * 0.175, (disp.d - 1) / 9);
    const pt = 18;
    const pxL = cx - gap/2, pxR = cx + gap/2;
    const topY = cy - plateH/2, botY = cy + plateH/2;

    drawBase(cx, baseY);
    drawSupport(pxL, topY, baseY); drawSupport(pxR, topY, baseY);

    // 接线柱（极板顶）
    const Lt = { x: pxL, y: topY - 22 };
    const Rt = { x: pxR, y: topY - 22 };
    // 电源 / 静电计位置
    const bx = cssW * 0.12, by = cy;
    const ex = cssW * 0.90, ey = cy;

    // 导线坐标
    const yTop = topY - 64, yBot = botY + 64;
    const wirePlus  = [ {x:bx, y:by-42}, {x:bx, y:yTop}, {x:pxL, y:yTop}, Lt ];
    const wireMinus = [ {x:bx, y:by+42}, {x:bx, y:yBot}, {x:pxR, y:yBot}, Rt ];
    const wireEmP   = [ {x:ex, y:ey-92}, {x:ex, y:yTop}, {x:pxL, y:yTop}, Lt ];
    const wireEmM   = [ {x:ex, y:ey+ (52)+8}, {x:ex, y:yBot}, {x:pxR, y:yBot}, Rt ];

    // 静电计导线（始终连接，理想伏特计）
    drawWire(wireEmP); drawWire(wireEmM);

    // 电源电路：开关 + 二极管
    const closed = (state.mode === 'charge');
    if (closed) {
        drawWire(wirePlus, Math.abs(flowDir) > 0 && flowDir > 0, '#ff9a9a', chargePhase);
        drawWire(wireMinus, Math.abs(flowDir) > 0 && flowDir > 0, '#9ac4ff', (1 - chargePhase));
    } else {
        // 断开：导线画到开关前残端
        const half1 = [ {x:bx, y:by-42}, {x:bx, y:yTop}, {x:(bx+pxL)/2 - 13, y:yTop} ];
        const half2 = [ {x:pxL, y:yTop}, {x:(bx+pxL)/2 + 13, y:yTop}, Lt ];
        drawWire(half1); drawWire(half2);
        const mhalf1 = [ {x:bx, y:by+42}, {x:bx, y:yBot}, {x:(bx+pxR)/2 - 13, y:yBot} ];
        const mhalf2 = [ {x:pxR, y:yBot}, {x:(bx+pxR)/2 + 13, y:yBot}, Rt ];
        drawWire(mhalf1); drawWire(mhalf2);
        drawOpenEnd({x:(bx+pxL)/2-13,y:yTop}, {x:(bx+pxL)/2+13,y:yTop}, '+');
        drawOpenEnd({x:(bx+pxR)/2-13,y:yBot}, {x:(bx+pxR)/2+13,y:yBot}, '−');
    }
    // 开关（在 + 导线上水平段中央）
    drawSwitch(closed, (bx + pxL)/2, yTop);
    // 二极管（接入时，在开关与左极板之间）
    if (state.diode) drawDiode((bx + pxL)/2 + (pxL - (bx+pxL)/2)*0.55, yTop, true);

    // 电源箱体
    drawBattery(bx, by);

    // 介质
    drawDielectric(pxL, pxR, topY, botY);
    drawGlow(pxL, pxR, topY, botY);
    drawFieldLines(pxL, pxR, pt, topY, botY);
    drawPlate(pxL, topY, botY, true);
    drawPlate(pxR, topY, botY, false);
    drawCharges(pxL, pxR, pt, topY, botY);
    drawElectrometer(ex, ey);

    // 介质标签
    if (disp.slab > 0.5) {
        const m = MATERIALS[state.material];
        ctx.fillStyle = hexA(m.color, 0.95); ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(m.name + '  εᵣ=' + m.er, cx, topY - 8);
    }
    // 拖动提示手柄
    drawHandles(pxL, pxR, topY, botY);
}

function drawHandles(pxL, pxR, topY, botY) {
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1.5;
    // 上边手柄（改面积）
    const hx = (pxL + pxR)/2;
    ctx.beginPath(); ctx.moveTo(hx-12, topY-4); ctx.lineTo(hx+12, topY-4); ctx.stroke();
    // 下边手柄
    ctx.beginPath(); ctx.moveTo(hx-12, botY+4); ctx.lineTo(hx+12, botY+4); ctx.stroke();
    // 右极板箭头（改间距）
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.beginPath(); ctx.moveTo(pxR+10, (topY+botY)/2); ctx.lineTo(pxR+22, (topY+botY)/2-6); ctx.lineTo(pxR+22, (topY+botY)/2+6); ctx.closePath(); ctx.fill();
    ctx.restore();
}

// ============================================================
//  数据面板
// ============================================================
const el = id => document.getElementById(id);
function updatePanel() {
    const A = disp.A * 1e-4, d = disp.d * 1e-3;
    const C = EPS0 * disp.er * A / d;
    el('oC').textContent = fmtC(C);
    el('oV').textContent = fmtV(disp.V);
    el('oQ').textContent = fmtQ(disp.Q);
    el('oS').textContent = fmtS(disp.sigma);
    el('oE').textContent = fmtE(disp.E);
    el('oEps').textContent = disp.er.toFixed(2);
    el('barQ').style.width = clamp(disp.Q / Q_REF, 0, 1) * 100 + '%';
    el('barS').style.width = clamp(disp.sigma / SIG_REF, 0, 1) * 100 + '%';
    el('barE').style.width = clamp(disp.E / E_REF, 0, 1) * 100 + '%';
    el('modeTag').textContent = state.mode === 'charge' ? (state.diode ? '充电·二极管' : '充电') : '断电';
    el('modeTag').className = 'tag ' + (state.mode === 'charge' ? 'charge' : 'off');
    el('noteText').innerHTML = noteHTML();
}
function noteHTML() {
    if (state.mode === 'charge' && !state.diode) {
        return '<b>充电（电源接通 · 开关闭合）</b>：电压 U 被电源锁定为 <b>U = V₀</b>。' +
            '改变 A、d、εᵣ 时电容 C = ε₀εᵣA/d 变化，电荷量 <b>Q = C·U</b> 随之变化，电荷经导线流入/流出极板（可见电流粒子）。' +
            '注意此时 σ = Q/A = ε₀εᵣU/d 与面积 A 无关；插电介质使 Q、σ 增大、电场线变密。';
    }
    if (state.mode === 'charge' && state.diode) {
        return '<b>充电（接入二极管 · 单向阀）</b>：二极管只允许电荷 <b>流入</b> 电容、阻断回流。' +
            '升高 V₀ 或增 C 时 Q 增大；一旦降压/减 C 使 Q 想减小，二极管反向截止，<b>电荷被锁住</b>，电压 U = Q/C 可超过 V₀（峰值保持）。';
    }
    return '<b>断电（电源断开 · 开关打开）</b>：极板与外界绝缘，<b>电荷量 Q 守恒不变</b>。' +
        '改变 A、d、εᵣ 时电压 <b>U = Q/C</b> 与场强 <b>E = σ/ε₀εᵣ</b> 随之变化。' +
        '增大面积 A → σ = Q/A 减小 → 电场线变稀疏、电压降低；插入电介质 → C 增大 → 电压降低、场强减小。';
}

// ============================================================
//  交互
// ============================================================
function postEdit() { try { if (window.parent && window.parent !== window) window.parent.postMessage({ type: 'phys-edit' }, '*'); } catch (_) {} }
function setMode(m) {
    if (m === 'off' && state.mode !== 'off') {
        const A = state.A * 1e-4, d = state.d * 1e-3, er = state.inserted ? MATERIALS[state.material].er : 1.0;
        state.Qfix = EPS0 * er * A / d * state.V0;
        if (actualQ != null) state.Qfix = actualQ;
    }
    state.mode = m;
    el('mCharge').classList.toggle('active', m === 'charge');
    el('mOff').classList.toggle('active', m === 'off');
    el('sV').disabled = (m === 'off');
    el('statusPill').innerHTML = (m === 'charge')
        ? (state.diode ? '充电模式 · 二极管单向阀（峰值保持）' : '充电模式 · 电压恒定 (U=V₀)')
        : '断电模式 · 电荷守恒 (Q 不变)';
    postEdit(); saveLocal();
}
el('mCharge').onclick = () => setMode('charge');
el('mOff').onclick = () => setMode('off');
el('mDiode').onclick = () => {
    state.diode = !state.diode;
    el('mDiode').classList.toggle('active', state.diode);
    el('mDiode').textContent = state.diode ? '撤去二极管' : '接入二极管';
    if (state.diode && state.mode === 'charge' && actualQ != null) { /* 保持当前电荷 */ }
    postEdit(); saveLocal();
};

el('sA').oninput = e => { state.A = +e.target.value; el('vA').textContent = state.A + ' cm²'; postEdit(); saveLocal(); };
el('sD').oninput = e => { state.d = +e.target.value; el('vD').textContent = state.d.toFixed(1) + ' mm'; postEdit(); saveLocal(); };
el('sV').oninput = e => { state.V0 = +e.target.value; el('vV').textContent = state.V0 + ' V'; postEdit(); saveLocal(); };

document.querySelectorAll('.mat').forEach(b => {
    b.onclick = () => {
        state.material = b.dataset.m;
        document.querySelectorAll('.mat').forEach(x => x.classList.toggle('active', x === b));
        state.inserted = (state.material !== 'air');
        el('bInsert').textContent = state.inserted ? '抽出电介质' : '插入电介质';
        postEdit(); saveLocal();
    };
});
el('bInsert').onclick = () => {
    state.inserted = !state.inserted;
    el('bInsert').textContent = state.inserted ? '抽出电介质' : '插入电介质';
    postEdit(); saveLocal();
};

function syncMatUI() { document.querySelectorAll('.mat').forEach(x => x.classList.toggle('active', x.dataset.m === state.material)); }

// 演示预设
el('p1').onclick = () => {
    setMode('charge'); state.diode = false; syncDiodeUI();
    state.A = 500; state.d = 2; state.inserted = false; state.material = 'air'; syncMatUI(); state.V0 = 10;
    syncSliders();
    setTimeout(() => { state.d = 8; syncSliders(); postEdit(); }, 250);
};
el('p2').onclick = () => {
    setMode('off'); state.diode = false; syncDiodeUI();
    state.A = 500; state.d = 2; state.material = 'glass'; syncMatUI(); state.inserted = false;
    el('bInsert').textContent = '插入电介质'; syncSliders();
    setTimeout(() => { state.inserted = true; el('bInsert').textContent = '抽出电介质'; postEdit(); }, 300);
};
el('p3').onclick = () => {
    setMode('off'); state.diode = false; syncDiodeUI();
    state.A = 500; state.d = 2; state.inserted = false; state.material = 'air'; syncMatUI();
    el('bInsert').textContent = '插入电介质'; syncSliders();
    setTimeout(() => { state.A = 1000; syncSliders(); postEdit(); }, 300);
};
el('p4').onclick = () => {
    setMode('charge'); state.diode = true; syncDiodeUI();
    state.A = 500; state.d = 2; state.inserted = false; state.material = 'air'; syncMatUI(); state.V0 = 10;
    syncSliders();
    // 先充电到 10V，再降压到 4V —— 二极管保持电荷，U 不降
    setTimeout(() => { state.V0 = 4; syncSliders(); postEdit(); }, 900);
};
function syncDiodeUI() {
    el('mDiode').classList.toggle('active', state.diode);
    el('mDiode').textContent = state.diode ? '撤去二极管' : '接入二极管';
}
function syncSliders() {
    el('sA').value = state.A; el('vA').textContent = state.A + ' cm²';
    el('sD').value = state.d; el('vD').textContent = state.d.toFixed(1) + ' mm';
    el('sV').value = state.V0; el('vV').textContent = state.V0 + ' V'; el('sV').disabled = (state.mode === 'off');
}

el('bReset').onclick = () => {
    state.mode = 'charge'; state.diode = false; state.A = 500; state.d = 2.0;
    state.material = 'air'; state.inserted = false; state.V0 = 10; state.Qfix = null; actualQ = null;
    syncDiodeUI(); syncSliders(); syncMatUI();
    el('bInsert').textContent = '插入电介质';
    setMode('charge'); saveLocal();
};

// 浮层开关
el('tMeter').onclick = () => toggleOverlay('tMeter', 'panelData');
el('tData').onclick  = () => toggleOverlay('tData',  'panelData');
el('tNote').onclick  = () => toggleOverlay('tNote',  'panelNote');
function toggleOverlay(btnId, panelId) {
    const b = el(btnId), p = el(panelId);
    const on = !b.classList.contains('active');
    b.classList.toggle('active', on);
    p.style.display = on ? '' : 'none';
}

// ============================================================
//  拖动极板（画布指针事件）
// ============================================================
let drag = null; // {type:'d'|'A', ...}
function getGeom() {
    const cx = cssW * 0.46, cy = cssH * 0.52;
    const plateH = lerp(cssH * 0.30, cssH * 0.62, (disp.A - 100) / 900);
    const gap = lerp(cssW * 0.045, cssW * 0.175, (disp.d - 1) / 9);
    const pt = 18;
    const pxL = cx - gap/2, pxR = cx + gap/2;
    const topY = cy - plateH/2, botY = cy + plateH/2;
    return { cx, cy, pxL, pxR, topY, botY, pt };
}
function canvasPos(e) {
    const r = cv.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
}
cv.addEventListener('pointerdown', e => {
    const p = canvasPos(e); const g = getGeom();
    const nearTop = Math.abs(p.y - g.topY) < 14 && p.x > g.pxL - 24 && p.x < g.pxR + 24;
    const nearBot = Math.abs(p.y - g.botY) < 14 && p.x > g.pxL - 24 && p.x < g.pxR + 24;
    const onRightPlate = Math.abs(p.x - g.pxR) < 22 && p.y > g.topY && p.y < g.botY;
    if (nearTop || nearBot) { drag = { type: 'A', edge: nearTop ? 'top' : 'bot', cy: g.cy, topY: g.topY, botY: g.botY }; cv.setPointerCapture(e.pointerId); }
    else if (onRightPlate || (p.x > g.pxL && p.x < g.pxR)) { drag = { type: 'd' }; cv.setPointerCapture(e.pointerId); }
});
cv.addEventListener('pointermove', e => {
    if (!drag) {
        // 光标提示
        const p = canvasPos(e); const g = getGeom();
        const nearTop = Math.abs(p.y - g.topY) < 14 && p.x > g.pxL - 24 && p.x < g.pxR + 24;
        const nearBot = Math.abs(p.y - g.botY) < 14 && p.x > g.pxL - 24 && p.x < g.pxR + 24;
        const onRightPlate = Math.abs(p.x - g.pxR) < 22 && p.y > g.topY && p.y < g.botY;
        if (nearTop || nearBot) cv.style.cursor = 'ns-resize';
        else if (onRightPlate || (p.x > g.pxL && p.x < g.pxR)) cv.style.cursor = 'ew-resize';
        else cv.style.cursor = 'default';
        return;
    }
    const p = canvasPos(e); const g = getGeom();
    if (drag.type === 'd') {
        // 间距 = 2*|x - cx|，映射到 d(1..10mm)
        let dg = Math.abs(p.x - g.cx);
        const dGapMin = cssW * 0.045, dGapMax = cssW * 0.175;
        let f = clamp((dg - dGapMin) / (dGapMax - dGapMin), 0, 1);
        state.d = +(1 + 9 * f).toFixed(1);
        el('sD').value = state.d; el('vD').textContent = state.d.toFixed(1) + ' mm';
    } else if (drag.type === 'A') {
        // 拖动上/下边缘改变 plateH（关于 cy 对称），再映射回 A
        let half = drag.edge === 'top' ? (g.cy - p.y) : (p.y - g.cy);
        const Hmin = cssH * 0.30, Hmax = cssH * 0.62;
        let H = clamp(2 * half, Hmin, Hmax);
        let f = clamp((H - Hmin) / (Hmax - Hmin), 0, 1);
        state.A = Math.round(100 + 900 * f);
        el('sA').value = state.A; el('vA').textContent = state.A + ' cm²';
    }
    postEdit(); saveLocal();
});
function endDrag(e) { if (drag) { drag = null; try { cv.releasePointerCapture(e.pointerId); } catch (_) {} } }
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);

// ============================================================
//  数据标签 / 说明面板可拖动
// ============================================================
function makeDraggable(panelId, headerId) {
    const panel = el(panelId), header = el(headerId);
    let dragging = false, ox = 0, oy = 0;
    header.addEventListener('pointerdown', e => {
        dragging = true;
        const r = panel.getBoundingClientRect(); const pr = panel.parentElement.getBoundingClientRect();
        ox = e.clientX - r.left; oy = e.clientY - r.top;
        panel.style.right = 'auto'; panel.style.bottom = 'auto';
        panel.style.left = (r.left - pr.left) + 'px';
        panel.style.top = (r.top - pr.top) + 'px';
        header.setPointerCapture(e.pointerId);
        e.preventDefault();
    });
    header.addEventListener('pointermove', e => {
        if (!dragging) return;
        const pr = panel.parentElement.getBoundingClientRect();
        let nx = e.clientX - pr.left - ox, ny = e.clientY - pr.top - oy;
        nx = clamp(nx, 0, pr.width - panel.offsetWidth);
        ny = clamp(ny, 0, pr.height - panel.offsetHeight);
        panel.style.left = nx + 'px'; panel.style.top = ny + 'px';
    });
    header.addEventListener('pointerup', e => { dragging = false; try { header.releasePointerCapture(e.pointerId); } catch (_) {} });
}
makeDraggable('panelData', 'dataHeader');
makeDraggable('panelNote', 'noteHeader');

// ---------- 本地保存 / 恢复 ----------
const LS_KEY = 'phys_cap_config_v2';
function saveLocal() { try { if (typeof localStorage !== 'undefined') localStorage.setItem(LS_KEY, JSON.stringify({ mode: state.mode, diode: state.diode, A: state.A, d: state.d, material: state.material, inserted: state.inserted, V0: state.V0 })); } catch (_) {} }
function loadLocal() {
    try {
        if (typeof localStorage === 'undefined') return;
        const raw = localStorage.getItem(LS_KEY); if (!raw) return;
        const o = JSON.parse(raw); const isNum = v => typeof v === 'number' && isFinite(v);
        if (o.mode === 'charge' || o.mode === 'off') state.mode = o.mode;
        if (typeof o.diode === 'boolean') state.diode = o.diode;
        if (isNum(o.A)) state.A = clamp(o.A, 100, 1000);
        if (isNum(o.d)) state.d = clamp(o.d, 1, 10);
        if (o.material && MATERIALS[o.material]) state.material = o.material;
        if (typeof o.inserted === 'boolean') state.inserted = o.inserted;
        if (isNum(o.V0)) state.V0 = clamp(o.V0, 1, 20);
    } catch (_) {}
}
function syncUIFromState() {
    el('sA').value = state.A; el('vA').textContent = state.A + ' cm²';
    el('sD').value = state.d; el('vD').textContent = state.d.toFixed(1) + ' mm';
    el('sV').value = state.V0; el('vV').textContent = state.V0 + ' V';
    el('sV').disabled = (state.mode === 'off');
    syncMatUI(); syncDiodeUI();
    el('bInsert').textContent = state.inserted ? '抽出电介质' : '插入电介质';
    setMode(state.mode);
}

// ============================================================
//  启动
// ============================================================
loadLocal();
resize();
syncUIFromState();
requestAnimationFrame(frame);

// 暴露给自检
window.__sim = {
    physFromParams, computeTarget, fieldLineCount, physRefSigma, physRefE, physRefQ,
    state, MATERIALS, EPS0, SIG_REF, E_REF, Q_REF,
    get disp() { return disp; },
    getQ: () => actualQ,
    step(p) { return computeTarget(actualQ == null ? 0 : actualQ, p); }
};
</script>
